openapi: 3.0.3

info:
  title: FUTO Notes Sync API
  version: "1.0.0"
  description: |
    HTTP contract for the FUTO Notes generic E2EE sync server. This document
    describes API **v1**: the behavior shipped by the TypeScript server (0.6.x)
    and the target the Go rewrite implements.

    This file is the shape layer only. It cannot express the parts of the
    contract that decide whether an implementation is actually correct:

    - transaction boundaries and lock ordering for create/update/delete
    - the `blob_ledger` state machine and blob lifetimes
    - `mutation_results` retention tiers and the in-progress claim
    - background job schedules

    Those live in `Specs/Rewriting the server in Go.md` and `DESIGN.md`. Two
    payloads here are custom binary framings that OpenAPI can only type as
    `application/octet-stream` — their byte layouts are documented inline on the
    relevant operations. The SSE stream is likewise described in prose on
    `GET /api/sync/events`.

    ## Value encoding

    Read this before generating types. Two representations coexist deliberately.

    Fields serialized straight off a database row are JSON **strings**, because
    they are Postgres `bigint` columns:

    - `object.version`, `object.change_seq`, `object.size_bytes`
    - `collection.current_version`

    Scalars the server computes are JSON **numbers**:

    - `collectionVersion` (mutation responses)
    - `currentVersion` (409 conflict bodies, SSE `change` events)
    - `nextCursor` (paged list responses)

    Requests run the other way: clients *send* `version` and `size_bytes` as
    JSON numbers. So comparing `object.change_seq` against `collectionVersion`
    compares a string to a number and never matches — coerce one side.

    ## Ownership and existence

    Anything the authenticated user does not own returns `404`, never `403`, so
    the API does not leak existence across tenants.

    ## Limits

    | Limit | Default | Applies to |
    |---|---|---|
    | `MAX_BLOB_BYTES` | 100 MiB (104857600) | one blob upload body, one batch-upload entry |
    | `MAX_BATCH_BYTES` | 32 MiB (33554432) | `blob-objects/batch` request body; `blobs/batch` response payload |
    | batch-fetch request body | 64 KiB (65536) | `POST /api/blobs/batch` |
    | batch fetch keys | 200 | `POST /api/blobs/batch` |
    | batch fetch key length | 128 chars | each key in `POST /api/blobs/batch` |
    | batch upload entries | 200 | `POST /api/collections/{cid}/blob-objects/batch` |
    | pull page size | clamped to 1000 | `?limit` on the objects list |
    | `Mutation-Id` length | 1–128 chars | every object mutation |
    | login rate limit | 10 per 60s per client | `POST /api/auth/password/login` |
    | session TTL | 7 days from issuance, no renewal | browser cookie, password mode, dev mode |
    | session TTL | 90 days from the last authenticated request | sessions redeemed from a Login Hand-off ticket |
    | session renewal write | at most once per hour | sliding sessions only |

    Any operation may also return `500 {"error": "internal server error"}`; that
    is omitted from individual operations below.
  license:
    name: FUTO Source First License
    url: https://sourcefirst.com/

servers:
  - url: "{baseUrl}"
    description: Any deployment origin
    variables:
      baseUrl:
        default: http://localhost:3000

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: capability
    description: Unauthenticated discovery and health
  - name: auth
    description: Login, session identity, logout
  - name: collections
    description: Vault containers and encrypted vault key material
  - name: objects
    description: Versioned metadata rows pointing at blobs
  - name: blobs
    description: Opaque ciphertext storage
  - name: pairing
    description: Device-to-device vault-key transfer
  - name: billing
    description: Plan limits, storage usage, and subscription state
  - name: sync
    description: Change notification stream

paths:
  /:
    get:
      operationId: getCapability
      tags: [capability]
      security: []
      summary: Capability discovery
      description: |
        Called once when a user adds a server, so one client build can drive any
        deployment's login flow and know whether retry-safe mutations exist.
      responses:
        "200":
          description: Server capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capability"

  /health:
    get:
      operationId: getHealth
      tags: [capability]
      security: []
      summary: Health check
      responses:
        "200":
          description: Database reachable
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  db:
                    type: string
                    enum: [connected]
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status:
                    type: string
                    enum: [degraded]
                  db:
                    type: string
                    enum: [unreachable]

  /api/auth/dev/login:
    post:
      operationId: devLogin
      tags: [auth]
      security: []
      summary: Passwordless login (dev mode only)
      description: |
        Mounted only when `AUTH_MODE=dev`. Upserts a user by email and opens a
        session. Development and tests only; the Go server may omit it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  description: Trimmed and lowercased by the server.
                name:
                  type: string
                  description: Defaults to the email's local part.
      responses:
        "200":
          $ref: "#/components/responses/LoginSuccess"
        "400":
          description: Invalid JSON, or `email` missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/password/login:
    post:
      operationId: passwordLogin
      tags: [auth]
      security: []
      summary: Password login (password mode only)
      description: |
        Mounted only when `AUTH_MODE=password`. Verifies the submitted password
        against the configured plaintext (`FUTO_NOTES_PASSWORD`) or scrypt hash
        (`FUTO_NOTES_PASSWORD_HASH`), lazily upserts the singleton user
        (`sub='local'`), and opens a session.

        Rate limited to `AUTH_RATE_LIMIT` (default 10) attempts per
        `AUTH_RATE_LIMIT_WINDOW_MS` (default 60000) per client, before the route
        handler runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/LoginSuccess"
        "400":
          description: Invalid JSON, or `password` missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: invalid password }
        "429":
          description: |
            Rate limit exceeded. Carries a `Retry-After` header in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: too many requests }

  /api/auth/oidc/start:
    get:
      operationId: oidcStart
      tags: [auth]
      security: []
      summary: Begin "Log in with FUTO" (OIDC mode only)
      description: |
        Mounted only when `AUTH_MODE=oidc`. Generates an OAuth `state` and PKCE
        code verifier, stores both in a short-lived `oidc_flow` cookie, and
        redirects the browser to the identity provider's authorization
        endpoint (Authorization Code flow with S256 PKCE).
      responses:
        "302":
          description: Redirect to the identity provider's authorization endpoint

  /api/auth/oidc/callback:
    get:
      operationId: oidcCallback
      tags: [auth]
      security: []
      summary: Complete "Log in with FUTO" (OIDC mode only)
      description: |
        Mounted only when `AUTH_MODE=oidc`. Requires the `oidc_flow` cookie
        set by `oidcStart` and a matching `state` query parameter, exchanges
        the authorization `code` for an access token, reads `sub`, `email`,
        `name`, and `preferred_username` from the userinfo endpoint, and
        upserts the user by `sub`. Opens a session on success.

        Rate limited like `passwordLogin`, before the route handler runs.

        On success: a login that carries a Login Hand-off ticket (see
        `mintLoginHandoff`) parks its session against that ticket, still sets
        the `session` cookie, and renders an HTML "go back to the app" page.
        A ticket that is unknown or expired by now parks nothing and still
        gets the page — the app's poll answers `404` and it mints a fresh
        ticket. A ticket whose identity is turned away by
        `HOSTED_ALLOWED_EMAIL_DOMAINS` is spent rather than parked, so that
        poll answers `404` immediately. Without a ticket: if the server is running with
        `DEV_UI=true`, redirects to `/dev`; otherwise redirects to `/account`,
        a bare browser page for signing in and managing the subscription.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The "go back to the app" page, for a login carrying a hand-off ticket
          content:
            text/html: {}
        "302":
          description: Redirect to `/dev` when `DEV_UI=true`, otherwise to `/account`
        "400":
          description: Missing or mismatched `state`, or a missing `oidc_flow` cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/SignupNotOpen"
        "429":
          description: |
            Rate limit exceeded. Carries a `Retry-After` header in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: too many requests }
        "502":
          description: The identity provider did not return a required claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/handoff:
    post:
      operationId: mintLoginHandoff
      tags: [auth]
      security: []
      summary: Mint a Login Hand-off ticket (OIDC mode only)
      description: |
        Mounted only when `AUTH_MODE=oidc`. Takes no body and no credentials.

        A Login Hand-off is how an app signs in without ever handling
        identity-provider tokens: it asks for a ticket and the URL to open,
        opens that URL in whatever browser surface it likes, and polls
        `redeemLoginHandoff` until the server hands back the same
        `{user, token}` a password login returns.

        `url` is the `oidcStart` route carrying the ticket, on the public
        origin taken from `OIDC_REDIRECT_URI` (whose path has to end in the
        callback route, since the start route is its sibling). The ticket is
        unguessable — 32 random bytes, base64url — and stays claimable for 10
        minutes.

        A ticket records which account authenticated, never a session token;
        the session is opened when the ticket is redeemed.

        Rate limited like `passwordLogin`, before the route handler runs.
      responses:
        "200":
          description: A ticket and the URL to open a browser at
          content:
            application/json:
              schema:
                type: object
                required: [ticket, url]
                properties:
                  ticket:
                    type: string
                  url:
                    type: string
                    format: uri
              example:
                ticket: O55Dik22Uc5E2KqAkQ0haBH3wjG3zkqnUeKmIEOd6BY
                url: https://notes.example.org/api/auth/oidc/start?ticket=O55Dik22Uc5E2KqAkQ0haBH3wjG3zkqnUeKmIEOd6BY
        "429":
          description: |
            Rate limit exceeded. Carries a `Retry-After` header in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: too many requests }

  /api/auth/handoff/{ticket}:
    get:
      operationId: redeemLoginHandoff
      tags: [auth]
      security: []
      summary: Poll a Login Hand-off ticket (OIDC mode only)
      description: |
        Mounted only when `AUTH_MODE=oidc`. Takes no credentials: the ticket
        is the credential, which is why it is single-use and short-lived.

        Poll this until it stops answering `202`. Once the browser has
        finished, one call returns the session and consumes the ticket; every
        call after that is a `404`. Not rate limited, so an app can poll on
        whatever interval suits it.

        A fulfilled ticket holds its session for 5 minutes from the callback,
        not from minting, so a slow login does not shorten the app's window.
      parameters:
        - name: ticket
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: |
            The same `{user, token}` body `LoginSuccess` carries, but no
            `Set-Cookie`: the browser already holds its own session cookie
            from the callback, and this session belongs to the app. The
            session is opened at redemption, and it slides: it expires 90
            days after its last authenticated request, not 90 days after
            this poll. The expiry is written forward at most once an hour,
            so a session can die up to an hour short of the full 90 days.
          content:
            application/json:
              schema:
                type: object
                required: [user, token]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  token:
                    type: string
                    description: |
                      Raw session token, 32 random bytes hex-encoded. Only
                      its SHA-256 hash is stored server-side.
        "202":
          description: |
            The person has not finished the browser login yet. Empty body.
        "404":
          description: |
            Unknown ticket, already redeemed, refused, or expired.
            Deliberately the same answer for all four, so polling never
            reveals whether a ticket exists. Mint a new one.

            "Refused" covers the `signup_not_open` case: the callback spends
            the ticket when it turns an identity away, so an app stops
            waiting on a login that is never coming instead of polling out
            the rest of the ticket's life.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: not found }

  /api/billing:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Plan limits and storage usage (OIDC mode only)
      description: |
        Mounted only when `AUTH_MODE=oidc`, which is how the hosted service
        runs. A self-hosted server answers `404` and has no Plan ceiling: it
        stores whatever fits on its disk.

        `plan` is the named set of limits the account is entitled to. One plan
        exists today, and it carries the two values the server previously
        enforced as constants, so nothing changed for an existing deployment.

        `usage.bytes_used` is the account's claimed and retained blob bytes.
        Staged blobs do not count until an object claims them, and purgeable
        ones stop counting as soon as a collection delete releases them. The
        number is a counter moved by the blob-ledger transitions, not a sum
        taken per request, and a recurring job recomputes it from the ledger
        and corrects any drift.

        `entitled` is the only field a client has to act on: it says whether
        writes will be accepted right now. `state` is Polar's own subscription
        status behind that answer, and `grace_until` is when a past-due
        account stops being entitled.
      responses:
        "200":
          description: The account's entitlement, plan limits, and storage usage
          content:
            application/json:
              schema:
                type: object
                required: [entitled, state, plan, usage]
                properties:
                  entitled:
                    type: boolean
                    description: |
                      Whether the account may currently write. True while the
                      subscription is active or trialing, and while a past-due
                      account is inside its Grace Period.
                  state:
                    type: string
                    description: |
                      Polar's subscription status, stored as delivered:
                      `incomplete`, `incomplete_expired`, `trialing`,
                      `active`, `past_due`, `canceled`, `unpaid`, or `paused`.
                      `none` for an account that has never subscribed.
                    example: active
                  grace_until:
                    type: string
                    format: date-time
                    nullable: true
                    description: |
                      When the Grace Period after a failed payment ends. Set
                      to the failure time plus seven days on the first
                      past-due event, not extended by the ones that follow,
                      and cleared when payment recovers. `null` at every other
                      time.
                  plan:
                    type: object
                    required: [storage_quota_bytes, blob_max_bytes]
                    properties:
                      storage_quota_bytes:
                        type: integer
                        format: int64
                        description: |
                          Ceiling on the account's total claimed and retained
                          blob bytes. A write that would cross it is refused
                          with `quota_exceeded`.
                      blob_max_bytes:
                        type: integer
                        format: int64
                        description: |
                          Largest single blob the account may upload. Applies
                          in every deployment, hosted or not.
                  usage:
                    type: object
                    required: [bytes_used]
                    properties:
                      bytes_used:
                        type: integer
                        format: int64
              example:
                entitled: true
                state: active
                grace_until: null
                plan: { storage_quota_bytes: 10000000000, blob_max_bytes: 104857600 }
                usage: { bytes_used: 4210688 }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Start a subscription (OIDC mode only)
      description: |
        Mounted only when `AUTH_MODE=oidc`. A self-hosted server answers `404`
        and sells nothing.

        Answers with a Polar checkout URL for the app to open in a browser —
        system browser, auth sheet, or webview, whichever the client picks.
        The person pays there, and Polar returns the browser to `billingDone`
        (`GET /billing/done`) on this server, which says to go back to the
        app. Nothing on this route tells the app whether payment succeeded:
        Entitlement moves only when Polar's webhook lands, so the app re-reads
        `GET /api/billing` afterwards.

        The account is registered with Polar the first time it reaches this
        route or the portal, under its OIDC `sub` as Polar's external customer
        id and its email address. That is the same id the webhook names the
        account by, so both ends of the round trip agree without a lookup
        table. Polar refuses a second customer carrying an external id it has
        already seen, so the id is stored and reused: abandoning a checkout
        and starting another registers nothing new.

        The checkout is for `POLAR_PRODUCT_ID`. While `POLAR_DISCOUNT_ID` is
        set it is applied to the checkout, which is how the internal MVP runs
        the real product's checkout at no charge; dropping the variable is the
        launch flip, with no product swap on the day.

        **An account that may already write gets its billing status instead of
        a URL**, in exactly the body `GET /api/billing` returns. Sending it to
        pay again would open a second subscription. The two answers are told
        apart by the presence of `url`.
      responses:
        "200":
          description: |
            Either a checkout URL to open, or — for an account that is already
            entitled — the billing status body.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        description: Polar checkout URL to open in a browser.
                  - type: object
                    required: [entitled, state, plan, usage]
                    description: |
                      The same body as `GET /api/billing`, returned when the
                      account may already write.
              example: { url: "https://buy.polar.sh/polar_cl_xxx" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: |
            Polar refused or was unreachable. Nothing was charged and nothing
            about the account changed; the same request may be retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/billing/portal:
    get:
      operationId: getBillingPortal
      tags: [billing]
      summary: Manage or cancel a subscription (OIDC mode only)
      description: |
        Mounted only when `AUTH_MODE=oidc`. A self-hosted server answers `404`.

        Answers with a pre-authenticated Polar customer portal URL for the app
        to open in a browser. Cancelling, changing a card, and reading
        invoices all happen there — this server implements none of it, and the
        app shows no billing UI of its own.

        Like the checkout, this registers the account with Polar on first use,
        so reaching the portal without ever having checked out works. The
        session URL is short-lived; ask for a new one rather than storing it.

        A cancellation reaches this server as a webhook. Polar leaves a
        subscription `active` until the period paid for runs out, so
        `GET /api/billing` keeps reporting `entitled: true` until Polar
        revokes it — which is what lets someone who cancels keep writing
        through the period they paid for.
      responses:
        "200":
          description: A customer portal URL to open in a browser
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
              example: { url: "https://polar.sh/futo/portal?customer_session_token=xxx" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: |
            Polar refused or was unreachable. Nothing about the account
            changed; the same request may be retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /billing/done:
    get:
      operationId: billingDone
      tags: [billing]
      security: []
      summary: The page Polar returns the browser to (OIDC mode only)
      description: |
        Mounted only when `AUTH_MODE=oidc`. A self-hosted server answers `404`.

        This is the `success_url` every checkout carries, derived from
        `OIDC_REDIRECT_URI` — the only public origin the server is ever told.
        Polar sends the browser here once payment goes through, and the
        browser holds no app session, so the route sits outside authentication
        like the OIDC callback does.

        It is an HTML "go back to the app" page and says nothing about the
        account on purpose: Entitlement moves when Polar's webhook lands, not
        when the browser arrives here, so the page cannot honestly report
        success. **The app finds out by re-reading `GET /api/billing`.**

        Not a route a client calls directly. It is documented because it is
        part of the checkout contract: an app that intercepts the browser
        needs to know which URL ends the flow.
      responses:
        "200":
          description: The "go back to the app" page
          content:
            text/html:
              schema:
                type: string

  /api/billing/polar/webhook:
    post:
      operationId: polarWebhook
      tags: [billing]
      summary: Subscription events from Polar (OIDC mode only)
      security: []
      description: |
        Mounted only when `AUTH_MODE=oidc`. **Polar calls this, not a client.**

        It is the only writer of the subscription fields, and therefore the
        only way Entitlement changes — the checkout and portal routes write
        the Polar customer id to the same record and touch nothing else.
        Truth lives locally: no sync request ever calls Polar, so a Polar
        outage cannot stop anyone syncing.

        Unauthenticated by necessity — Polar holds no session — and
        authenticated in substance by a
        [Standard Webhooks](https://www.standardwebhooks.com/) signature over
        the exact bytes delivered, carried in the `webhook-id`,
        `webhook-timestamp`, and `webhook-signature` headers and checked
        against `POLAR_WEBHOOK_SECRET`. A delivery whose signature does not
        verify, or whose timestamp is more than five minutes from now, changes
        nothing.

        The account is found by Polar's external customer id, which is the
        account's OIDC `sub`. A delivery naming a customer this server does
        not know is acknowledged and logged rather than retried, because a
        retry would not find the account either.

        Acted on: `subscription.created`, `subscription.active`,
        `subscription.updated`, `subscription.past_due`,
        `subscription.canceled`, `subscription.revoked`. Every other type is
        acknowledged and ignored, so an endpoint subscribed to more than this
        does not accumulate retries.

        Applying the same delivery twice leaves the same record: every stored
        field is derived from the event, and the Grace Period deadline is set
        only when the account enters past-due, so a replay cannot push it out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type:
                  type: string
                  example: subscription.active
                data:
                  type: object
                  description: |
                    Polar's subscription object. This server reads `id`,
                    `status`, `customer_id`, `current_period_end`, and
                    `customer.external_id`.
      responses:
        "200":
          description: |
            Delivery accepted. `applied` wrote the record, `ignored` was a
            type this server does not act on, and `unknown_customer` named an
            external customer id no account carries.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [applied, ignored, unknown_customer]
              example: { status: applied }
        "400":
          description: Body was unreadable or was not JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: invalid json }
        "401":
          description: |
            The signature did not verify against `POLAR_WEBHOOK_SECRET`, a
            required header was missing, or the timestamp was outside the
            five-minute tolerance. Nothing was written.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [invalid_signature]
              example: { error: invalid webhook signature, code: invalid_signature }

  /api/auth:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Who am I
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Destroy the current session
      description: Deletes the session row and clears the `session` cookie.
      responses:
        "204":
          description: Session destroyed
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/collections:
    post:
      operationId: claimCollection
      tags: [collections]
      summary: Claim the account's vault, or return the existing one
      description: |
        One vault per account. Takes no request body. Creates the vault the
        first time (`201`) and returns that same vault on every later call
        (`200`), so two devices setting up concurrently converge instead of
        forking. Read the id from the response rather than branching on the
        status.

        Accounts holding several collections from before this cap keep all of
        them; this route returns the oldest by `(created_at, id)`, which is the
        one to sync against.
      responses:
        "201":
          description: Vault created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionEnvelope"
        "200":
          description: Vault already existed; this is it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listCollections
      tags: [collections]
      summary: List the user's collections
      description: Ordered oldest first by `(created_at, id)`.
      responses:
        "200":
          description: The user's collections
          content:
            application/json:
              schema:
                type: object
                required: [collections]
                properties:
                  collections:
                    type: array
                    items:
                      $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/collections/{id}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    get:
      operationId: getCollection
      tags: [collections]
      summary: Get one collection
      responses:
        "200":
          description: The collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Delete a collection
      description: |
        Objects cascade. The collection's claimed and retained blobs become
        immediately purgeable and are removed by asynchronous maintenance
        (storage bytes first, then ledger rows). Mutation results scoped to this
        collection are deleted, because that sync namespace no longer exists.
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/collections/{id}/key:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    get:
      operationId: getCollectionKey
      tags: [collections]
      summary: Get encrypted vault key material
      responses:
        "200":
          description: |
            The stored material, or `{"key": null}` when the collection exists
            but no key has been claimed yet. The three `recovery_*` fields are
            `null` when the vault has no recovery envelope.
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    type: object
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/KeyMaterial"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putCollectionKey
      tags: [collections]
      summary: Claim or re-wrap encrypted vault key material
      description: |
        Every material field is opaque to the server.

        **Claim** (no `previous_key_updated_at`): sets the material if none
        exists. Resubmitting identical material is idempotent and returns the
        original `key_updated_at`. Losing a race to mint the first key is *not*
        an error — the server returns `200` with the **authoritative** material,
        which may differ from what was sent. Adopt what comes back; one vault
        has exactly one key, and the winner's key is never overwritten.

        **Re-wrap** (replacing material that already exists): requires
        `previous_key_updated_at` equal to the current `key_updated_at` from a
        prior GET or PUT. The server treats it as an opaque revision token — do
        not parse or synthesize it. A caller holding the current token may
        re-wrap as often as it likes; a second write is not a conflict, only a
        stale one is. A stale token returns `409` with the authoritative
        material in `currentKey`; re-read, re-wrap from the new token, and
        retry. This is what lets an already-unlocked client change the vault
        password or issue a new recovery key without a first-claim conflict.

        **The recovery envelope is optional, and "optional" does not mean
        "leave unchanged".** A PUT replaces the whole of the key material, both
        envelopes together. **Omitting the three `recovery_*` fields DELETES
        any recovery envelope already stored for this vault**, in the same
        write that stores the password envelope. There is no partial update and
        no way to address one envelope on its own.

        So a client re-wrapping one envelope **must send the other back
        unchanged in the same request**. Changing the vault password re-wraps
        the *same* vault key, so a recovery envelope left out of that request
        would still have opened the vault — leaving it out destroys a working
        recovery door and the person loses their way back in. The same holds in
        reverse when issuing a new recovery key.

        Deleting is the right outcome in exactly one case: a v1 client, which
        mints a fresh vault key when it re-wraps and so leaves any old recovery
        envelope wrapping a key that no longer exists. Keeping that would be a
        recovery door that opens nothing.

        Send all three `recovery_*` fields or none; a partial set is a `400`,
        because half an envelope is a recovery door that cannot be opened. A
        client that knows only the vault password — a v1 client, or self-hosted
        password mode — omits all three and is otherwise unaffected.

        A successful re-wrap does not emit an SSE `change` event; peers learn
        about it on their next poll.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key_salt, key_kdf, encrypted_vault_key]
              properties:
                key_salt:
                  type: string
                  minLength: 1
                key_kdf:
                  type: object
                  description: Any JSON object — the client's KDF parameters.
                  additionalProperties: true
                encrypted_vault_key:
                  type: string
                  minLength: 1
                previous_key_updated_at:
                  type: string
                  minLength: 1
                  description: |
                    Opaque revision token from a prior GET/PUT. Required for a
                    re-wrap, omitted for a first claim.
                recovery_key_salt:
                  type: string
                  minLength: 1
                  description: |
                    Part of the optional recovery envelope. Send all three
                    `recovery_*` fields or none; a partial set is a `400`.
                    **Omitting all three deletes any stored recovery
                    envelope** — it does not leave it unchanged. Re-send the
                    stored envelope to keep it.
                recovery_key_kdf:
                  type: object
                  additionalProperties: true
                  description: |
                    Any JSON object — the client's recovery-key KDF parameters.
                    **Omitting the `recovery_*` fields deletes any stored
                    recovery envelope.**
                recovery_encrypted_vault_key:
                  type: string
                  minLength: 1
                  description: |
                    The vault key wrapped under the recovery key. **Omitting
                    the `recovery_*` fields deletes any stored recovery
                    envelope.**
      responses:
        "200":
          description: Material stored, or the authoritative material adopted
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    $ref: "#/components/schemas/KeyMaterial"
        "400":
          description: |
            Invalid JSON, a missing/empty required field, a
            `previous_key_updated_at` sent when no key is stored, or a partial
            recovery envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Stale revision token
          content:
            application/json:
              schema:
                type: object
                required: [error, currentKey]
                properties:
                  error:
                    type: string
                    enum: [key conflict]
                  currentKey:
                    $ref: "#/components/schemas/KeyMaterial"

  /api/pairings:
    post:
      operationId: createPairing
      tags: [pairing]
      summary: Open a Device Pairing
      description: |
        A new device that is already signed in publishes the one-time public
        key an already-unlocked device on the same account will seal the vault
        key to, and says what to call it on the confirmation that device
        shows. Mounted in every `AUTH_MODE`.

        The three fields are opaque: the server stores them, cannot read them,
        and never hands them back. The device that needs them reads them out
        of the QR payload it just scanned, which carries the pairing id
        alongside them.

        **Not gated on Entitlement.** A lapsed subscription pauses writes, but
        not this one — someone who stopped paying must still be able to set up
        a device and read what they already stored.

        Contract of record: `docs/adr/0008-pairing-relay-wire-contract.md`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, device_name, platform]
              properties:
                public_key:
                  type: string
                  maxLength: 1024
                  description: |
                    The new device's one-time public key, in whatever encoding
                    the client and its peer agree on. Its private half never
                    leaves the new device, which is why the server cannot open
                    what gets posted to this pairing.
                device_name:
                  type: string
                  maxLength: 1024
                  description: What the new device calls itself, self-reported.
                platform:
                  type: string
                  maxLength: 1024
                  description: The new device's platform, self-reported.
            example:
              public_key: MCowBQYDK2VuAyEA3f1aK9pQ2cJ7xw4mR8vZ0tN6yB5sE1hX
              device_name: Kitchen laptop
              platform: desktop
      responses:
        "201":
          description: The pairing, as the QR payload needs it
          content:
            application/json:
              schema:
                type: object
                required: [id, expires_at]
                properties:
                  id:
                    type: string
                    description: |
                      Unguessable — 32 random bytes, base64url. The account
                      check is what keeps a pairing private; the id being
                      unguessable means a stranger cannot even ask about one.
                  expires_at:
                    type: string
                    format: date-time
                    description: |
                      Five minutes out. The clock starts here and is not
                      restarted by the key being posted.
              example:
                id: koiKEC2jss5UMppDtKLHp5Zal8NhdQG2_plXmsHL0BI
                expires_at: "2026-09-15T17:29:53.217936883Z"
        "400":
          description: A missing, empty, or over-long field, or a malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Body exceeds 8 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: request too large }

  /api/pairings/{id}/key:
    post:
      operationId: deliverPairingKey
      tags: [pairing]
      summary: Post the vault key to a Device Pairing
      description: |
        The already-unlocked device scans the new device's QR code, seals the
        vault key to the public key it carries, and posts the result here. The
        server relays ciphertext it cannot open: it never sees a vault key,
        Vault Password, or Recovery Key, and it does not log the body.

        The pairing has to belong to the calling account. One key per pairing.

        **Not gated on Entitlement**, like `createPairing`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ciphertext]
              properties:
                ciphertext:
                  type: string
                  maxLength: 1024
                  description: |
                    The vault key sealed to the pairing's `public_key`, in
                    whatever encoding the two devices agree on. Opaque here.
      responses:
        "204":
          description: Stored, waiting for the new device to collect it
        "400":
          description: A missing, empty, or over-long `ciphertext`, or a malformed body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Unknown pairing, expired, already collected, or belonging to
            another account. Deliberately the same answer for all four, so a
            pairing id cannot be probed for existence from another account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: not found }
        "409":
          description: |
            This pairing already carries a key. Only the owning account can
            reach this — a stranger's post is a `404` before the pairing's
            state is consulted — so it tells the owner what happened without
            telling anyone else that the pairing exists.

            Not retry-safe-by-idempotence: a sealed box is nondeterministic,
            so a repeated post carries different bytes and there is nothing to
            match it against. If you cannot tell whether your post landed,
            create a new pairing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: pairing already has a key }
        "413":
          description: Body exceeds 8 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: request too large }

  /api/pairings/{id}:
    get:
      operationId: collectPairingKey
      tags: [pairing]
      summary: Poll a Device Pairing
      description: |
        The new device polls this until it stops answering `202`. One call
        returns the sealed vault key and spends the pairing; every call after
        that is a `404`. Of two devices polling at once exactly one gets the
        key — reading it and deleting the row happen in one transaction — so a
        second poll is never a replay.

        The pairing has to belong to the calling account. Poll on whatever
        interval suits you; this route is not rate limited.

        **Not gated on Entitlement**, like the other two.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: |
            The sealed vault key, exactly once. Decrypt it with the private
            half of the one-time key this device published, and the pairing is
            done.
          content:
            application/json:
              schema:
                type: object
                required: [ciphertext]
                properties:
                  ciphertext:
                    type: string
                    description: Exactly the bytes the unlocked device posted.
        "202":
          description: |
            The unlocked device has not posted the key yet. Empty body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Unknown pairing, expired, already collected, or belonging to
            another account — the same single answer `deliverPairingKey`
            gives, for the same reason. Start a new pairing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: not found }

  /api/collections/{cid}/objects:
    parameters:
      - $ref: "#/components/parameters/CollectionIdCid"
    get:
      operationId: listObjects
      tags: [objects]
      summary: Pull objects changed since a cursor
      description: |
        Returns every object in the collection whose `change_seq` is greater
        than `sinceVersion`, ordered ascending. Apply rows in order, then
        advance the cursor to the highest `change_seq` received. `deleted: true`
        rows are tombstones, and they are kept indefinitely: a pull from zero
        reports every object the collection has ever deleted.

        Omitting `limit` returns `{"objects": [...]}` with no row cap. Supplying
        it adds `hasMore` and `nextCursor` to the response.
      parameters:
        - name: sinceVersion
          in: query
          required: false
          description: Exclusive cursor. Defaults to 0 (full pull).
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: |
            Page size. Values above 1000 are silently clamped to 1000, not
            rejected. Values below 1 or non-integers return `400`.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The delta page
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ObjectList"
                  - $ref: "#/components/schemas/PagedObjectList"
        "400":
          description: Invalid `sinceVersion` or `limit`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createObject
      tags: [objects]
      summary: Create an object from a staged blob
      description: |
        Two-call create: upload ciphertext with `POST /api/blobs` first, then
        name the returned key here. `blob_key` must be `{your-user-id}/{uuid}`
        and must still be staged; a key already claimed by an earlier mutation,
        or one whose 24-hour staging window expired, returns
        `409 blob is not staged`. Re-upload to get a fresh key and retry under a
        **new** `Mutation-Id`.

        `size_bytes` is validated but not stored — the response reflects the
        byte length the server measured when the blob was staged.

        A replayed `Mutation-Id` also returns `201`, with `replayed: true`.
      parameters:
        - $ref: "#/components/parameters/MutationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blob_key, size_bytes]
              properties:
                blob_key:
                  type: string
                  description: A staged key owned by the caller.
                  example: 018f4b28-11aa-7d3e-9f0a-3c4d5e6f7a8b/018f4b2b-22bb-7e4f-8a1b-4d5e6f7a8b9c
                size_bytes:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        "201":
          description: Created, or the replayed outcome of this Mutation-Id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMutationSuccess"
        "400":
          description: |
            Invalid JSON, or `blob_key`/`size_bytes` failed validation, or the
            `Mutation-Id` header is syntactically invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Blob not staged, or Mutation-Id reused for a different intent
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BlobNotStagedError"
                  - $ref: "#/components/schemas/MutationMismatchError"
        "507":
          $ref: "#/components/responses/QuotaExceeded"

  /api/collections/{cid}/objects/{oid}:
    parameters:
      - $ref: "#/components/parameters/CollectionIdCid"
      - $ref: "#/components/parameters/ObjectId"
    get:
      operationId: getObject
      tags: [objects]
      summary: Get object metadata
      responses:
        "200":
          description: The object
          content:
            application/json:
              schema:
                type: object
                required: [object]
                properties:
                  object:
                    $ref: "#/components/schemas/Object"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateObject
      tags: [objects]
      summary: Update an object (version-guarded)
      description: |
        `version` must equal the object's current version + 1; anything else is
        a `409` carrying the server's current state. `blob_key` must still be
        staged, with the same re-upload-under-a-new-Mutation-Id rule as create.

        Unlike create, the success body carries no `replayed` field.

        The prior claimed blob moves to `retained` and stays fetchable for 365
        days, so it can serve as a merge ancestor.
      parameters:
        - $ref: "#/components/parameters/MutationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, blob_key, size_bytes]
              properties:
                version:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Must be the object's current version + 1.
                blob_key:
                  type: string
                size_bytes:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationSuccess"
        "400":
          description: Invalid JSON, invalid fields, or invalid `Mutation-Id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version conflict, blob not staged, or Mutation-Id intent mismatch
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VersionConflict"
                  - $ref: "#/components/schemas/BlobNotStagedError"
                  - $ref: "#/components/schemas/MutationMismatchError"
        "507":
          $ref: "#/components/responses/QuotaExceeded"
    delete:
      operationId: deleteObject
      tags: [objects]
      summary: Soft delete an object
      description: |
        Sets `deleted: true` and bumps the version so peers see the tombstone.
        The blob moves to `retained` and stays fetchable for 365 days, because
        it may be a merge ancestor — the same treatment an update gives the
        blob it supersedes. After that window the blob is reclaimed. The
        tombstone row itself is kept indefinitely, so peers can always learn
        about the deletion.

        Supplying `?version=N` makes the delete lose to a newer concurrent edit
        (edit-vs-delete race; the edit wins). Omit it to delete
        unconditionally. Deleting an already-deleted object is a successful
        no-op: it returns the current tombstone without advancing either the
        object version or collection cursor. A stale `?version` still returns
        `409` against a tombstone.

        The success body carries the compact object projection
        (`id`, `version`, `change_seq`, `deleted`), not the full row.
      parameters:
        - $ref: "#/components/parameters/MutationIdHeader"
        - name: version
          in: query
          required: false
          description: Optional race guard — the version the client expects to delete.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Tombstoned
          content:
            application/json:
              schema:
                type: object
                required: [object, collectionVersion]
                properties:
                  object:
                    $ref: "#/components/schemas/DeletedObject"
                  collectionVersion:
                    $ref: "#/components/schemas/CollectionVersion"
        "400":
          description: Invalid `?version`, or invalid `Mutation-Id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version conflict, or Mutation-Id intent mismatch
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VersionConflict"
                  - $ref: "#/components/schemas/MutationMismatchError"

  /api/collections/{cid}/blob-objects:
    parameters:
      - $ref: "#/components/parameters/CollectionIdCid"
    post:
      operationId: createBlobObject
      tags: [objects]
      summary: Create an object and its blob in one call
      description: |
        Single round trip: the body is raw ciphertext and the server mints,
        stages, and claims the blob key itself. Semantics match the two-call
        create, except `409 blob is not staged` cannot occur — there is no
        caller-supplied key to go stale.

        Blob bytes are written before the mutation transaction opens, so a
        request later declined by conflict or replay leaves an unclaimed blob
        that the 24-hour staging window reclaims.

        Use a `Mutation-Id` here especially: the success response can be lost
        after the server has already committed.
      parameters:
        - $ref: "#/components/parameters/MutationIdHeader"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: |
                Raw ciphertext. Empty body → 400. Over the Plan's per-blob cap
                → 413. Past the account's Storage Quota → 507.
      responses:
        "201":
          description: Created, or the replayed outcome of this Mutation-Id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMutationSuccess"
        "400":
          description: Empty body, or invalid `Mutation-Id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Mutation-Id reused for a different intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationMismatchError"
        "413":
          $ref: "#/components/responses/BlobTooLarge"
        "507":
          $ref: "#/components/responses/QuotaExceeded"

  /api/collections/{cid}/blob-objects/{oid}:
    parameters:
      - $ref: "#/components/parameters/CollectionIdCid"
      - $ref: "#/components/parameters/ObjectId"
    put:
      operationId: updateBlobObject
      tags: [objects]
      summary: Update an object and its blob in one call
      description: |
        Single-round-trip update. `?version` is **required** here (the two-call
        route carries it in the JSON body instead). Same conflict semantics;
        `409 blob is not staged` cannot occur.
      parameters:
        - $ref: "#/components/parameters/MutationIdHeader"
        - name: version
          in: query
          required: true
          description: Must be the object's current version + 1.
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationSuccess"
        "400":
          description: Missing/invalid `?version`, empty body, or invalid `Mutation-Id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version conflict, or Mutation-Id intent mismatch
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VersionConflict"
                  - $ref: "#/components/schemas/MutationMismatchError"
        "413":
          $ref: "#/components/responses/BlobTooLarge"
        "507":
          $ref: "#/components/responses/QuotaExceeded"

  /api/collections/{cid}/blob-objects/batch:
    parameters:
      - $ref: "#/components/parameters/CollectionIdCid"
    post:
      operationId: batchBlobObjects
      tags: [objects]
      summary: Batch create/update with inline ciphertext
      description: |
        **Custom binary request framing.** The body concatenates 1–200 frames,
        repeating to EOF, integers big-endian:

        ```
        [u8 operation][u16 identifierLen][identifier utf8][u32 version][u32 blobLen][blob bytes]
        ```

        - operation `0` = create. `identifier` is the client-generated
          `Mutation-Id` and must match `^[A-Za-z0-9._~-]{1,128}$`. `version`
          must be `0`. Retrying a frame under the same Mutation-Id returns the
          original object even if the retry carries different ciphertext.
        - operation `1` = update. `identifier` is the object UUID and `version`
          must be the next positive object version. Batch updates carry no
          Mutation-Id; the version guard alone stops a retry from advancing the
          version twice.
        - `blobLen` must be non-zero.

        Entries are **not** one transaction. Each is coordinated independently,
        in order, and one failure does not stop the rest. Each successful
        non-replay mutation publishes its own SSE `change` event; conflicts,
        failures, and replays publish none.

        Results are returned in request order. Malformed framing, an empty
        batch, or more than 200 entries rejects the whole request with `400`.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Per-entry results, in request order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/BatchUploadResult"
        "400":
          description: |
            Framing error, empty batch, or over 200 entries. The message names
            the failure: `truncated operation`, `invalid operation`,
            `truncated object id length`, `truncated identifier`,
            `invalid identifier`, `invalid create mutation id`,
            `invalid update object id`, `truncated version`,
            `create version must be zero`, `update version must be positive`,
            `truncated blob length`, `blob must not be empty`, `truncated blob`,
            `too many entries (max 200)`,
            `batch must contain at least one entry`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Request body exceeds `MAX_BATCH_BYTES`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: request too large }

  /api/collections/{cid}/create-mutations/{mutationId}:
    parameters:
      - $ref: "#/components/parameters/CollectionIdCid"
      - name: mutationId
        in: path
        required: true
        description: |
          The create Mutation-Id to look up. Percent-encode it if it contains
          characters outside the URL-safe set.
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      operationId: getCreateMutation
      tags: [objects]
      summary: Recover a durable create outcome
      description: |
        For a client that lost the original create body — the local file was
        deleted after an ambiguous response — and cannot replay ciphertext.

        Successful create outcomes are retained for the collection's lifetime,
        which is what makes a `404` meaningful: for an existing collection it
        proves this scoped Mutation-Id never committed a create. Clients that
        discard pending state on that `404` must only ship against a server
        advertising `mutation_ids.successful_create_outcomes: "durable"`.

        A create still staging returns `409`; retain pending state and retry.
      responses:
        "200":
          description: "The recorded create outcome, with `replayed: true`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateMutationSuccess"
        "400":
          description: Invalid Mutation-Id syntax
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: invalid Mutation-Id }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No create committed under this Mutation-Id — or the collection is
            not the caller's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The original create is still in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: mutation still in progress }

  /api/blobs:
    post:
      operationId: uploadBlob
      tags: [blobs]
      summary: Stage an encrypted blob
      description: |
        Body is raw ciphertext. Returns the storage key, always scoped to the
        caller as `{user-id}/{uuid}`. The blob is `staged` for a fixed 24 hours;
        an accepted create or update claims it for exactly one object version.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Staged
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    type: string
                    example: 018f4b28-11aa-7d3e-9f0a-3c4d5e6f7a8b/018f4b2b-22bb-7e4f-8a1b-4d5e6f7a8b9c
        "400":
          description: Empty body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: empty body }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/SubscriptionRequired"
        "413":
          $ref: "#/components/responses/BlobTooLarge"
        "507":
          $ref: "#/components/responses/QuotaExceeded"

  /api/blobs/batch:
    post:
      operationId: batchFetchBlobs
      tags: [blobs]
      summary: Fetch up to 200 blobs in one request
      description: |
        Removes the per-request overhead that makes a large first sync
        latency-bound.

        **Custom binary response framing** — one frame per requested key, in
        request order, integers big-endian:

        ```
        [u16 keyLen][key utf8][u8 status][u32 blobLen][blob bytes]
        ```

        | status | meaning |
        |---|---|
        | `0` ok | `blobLen` bytes of blob follow |
        | `1` missing | absent, malformed, or not owned by the caller — same no-existence-leak policy as the single GET's 404; `blobLen = 0` |
        | `2` omitted | including this blob would push the encoded response past `MAX_BATCH_BYTES`; re-request omitted keys in a fresh batch; `blobLen = 0` |

        The cap counts every frame's 7 fixed bytes, UTF-8 key bytes, and blob
        bytes. The first available blob always ships even if its frame alone
        exceeds the cap, so a client always makes progress.

        A storage read failure after the `200` has been sent aborts the stream
        mid-body rather than emitting an error frame; clients see a truncated
        transfer and retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keys]
              properties:
                keys:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: string
                    maxLength: 128
      responses:
        "200":
          description: Binary frame stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: |
            Invalid JSON, empty `keys`, a non-string or over-128-char key, or
            more than 200 keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: Request body over 64 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: request too large }

  /api/blobs/{userId}/{blobId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: Must be the authenticated user's id, else `404`.
        schema:
          type: string
          format: uuid
      - name: blobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadBlob
      tags: [blobs]
      summary: Download a blob
      responses:
        "200":
          description: Raw ciphertext
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBlob
      tags: [blobs]
      summary: Delete a staged blob
      description: |
        Direct deletion is allowed only while the blob is `staged`. Idempotent
        for staged or absent blobs, including legacy files not yet adopted into
        the ledger. Any other ledger state — `claimed`, `retained`,
        `purgeable`, `legacy_shared` — is governed by object/collection
        lifetime and returns `409`.
      responses:
        "204":
          description: Deleted, or already absent
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Blob is claimed, retained, purgeable, or legacy-shared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example: { error: blob is in use }

  /api/sync/events:
    get:
      operationId: syncEvents
      tags: [sync]
      summary: SSE change stream
      description: |
        A **doorbell, not a pipe**: events carry no object content, only enough
        routing information to say which collection changed, so the E2EE
        invariant holds. Response headers include `X-Accel-Buffering: no` so
        proxies that don't auto-detect SSE stop buffering.

        Events:

        | event | data | meaning |
        |---|---|---|
        | `ready` | *(empty)* | sent once per connection — treat as "pull now from your cursor" |
        | `change` | `{"collectionId": "...", "currentVersion": N}` | a mutation happened; pull that collection. `currentVersion` is a JSON **number** |
        | `ping` | *(empty)* | heartbeat every 25s; ignore |

        Pending `change` events are coalesced per collection (newest version
        wins) rather than queued, bounding memory under a slow reader.

        **The stream is lossy across disconnects.** Events fired while it is
        down are not replayed; there is no event log and no `Last-Event-ID`
        recovery. The server deliberately ends the stream when its upstream
        Postgres `LISTEN` connection drops, so a client reconnects and re-pulls
        instead of trusting a silently-dead stream. Therefore: pull on every
        `ready`, and keep a low-frequency safety poll (30–60s) as a backstop.

        Browser caveat: native `EventSource` cannot set an `Authorization`
        header, and CORS here is `*` without credentials, so a cross-origin
        browser `EventSource` will not authenticate. Same-origin browsers and
        any client that can set a bearer header are unaffected.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The raw session token returned by a login endpoint. Preferred for
        non-browser clients. A token redeemed from a Login Hand-off ticket
        slides: it expires 90 days after the last authenticated request. If
        the request also carries a `session` cookie, the cookie is checked
        first and wins, and the request gets the cookie's fixed 7-day session
        instead of this token's sliding one.
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        `httpOnly` cookie set by login; `Secure` unless `COOKIE_SECURE=false`,
        `SameSite=Lax`, `Max-Age` 7 days. A cookie session is always fixed at
        7 days; only a token redeemed from a Login Hand-off ticket slides. The
        cookie is checked before the `Authorization` header.

  parameters:
    CollectionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionIdCid:
      name: cid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ObjectId:
      name: oid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MutationIdHeader:
      name: Mutation-Id
      in: header
      required: false
      description: |
        Client-generated idempotency key. Reuse the same value only when
        retrying the *same* intended mutation; reusing it for a different kind,
        collection, object, or requested version returns `409`.

        A retry inside the retention window returns the recorded outcome
        without advancing the object version or collection cursor and without
        publishing another change event; the retry body is ignored and the
        object keeps the original attempt's blob key.

        Successful create outcomes are retained for the collection's lifetime;
        other outcomes expire after 30 days. Definitive `404` and `409`
        outcomes are recorded like successes. Requests rejected earlier —
        invalid JSON or fields, empty or oversized bodies, an invalid
        Mutation-Id — are not recorded, because they carry no valid intent.

        Omitting the header leaves the request an independent mutation: a
        retry after a lost response can duplicate an object.

        The pattern below is the syntax required on the framed batch route and
        the one the Go server accepts everywhere. The TypeScript server also
        accepts any non-empty 1–128-character value on the classic routes; that
        looser legacy syntax is deliberately dropped in v1 Go.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._~-]{1,128}$"

  responses:
    LoginSuccess:
      description: |
        Session opened. The raw token is returned in the body *and* set as the
        `session` cookie.
      headers:
        Set-Cookie:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required: [user, token]
            properties:
              user:
                $ref: "#/components/schemas/User"
              token:
                type: string
                description: |
                  Raw session token, 32 random bytes hex-encoded. Only its
                  SHA-256 hash is stored server-side.
    Unauthorized:
      description: |
        No credentials were supplied (`{"error": "unauthorized"}`), or the
        supplied session is expired/invalid — which additionally carries
        `WWW-Authenticate: Bearer realm="futo-notes", error="invalid_token"`
        and the stable code `invalid_session`. A client holding retained login
        material should re-login, retry once, and **keep** its sync cursor and
        object map; session expiry is not a vault reset.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                required: [error, code]
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [invalid_session]
    SignupNotOpen:
      description: |
        The identity the provider authenticated is not allowed to sign up.
        During the internal MVP the hosted service limits sign-in to the
        email domains in `HOSTED_ALLOWED_EMAIL_DOMAINS` (comma-separated,
        compared case-insensitively). Checked at the callback before any user
        row exists, so a rejected person leaves no account behind. Unset the
        variable to admit every identity the provider authenticates.
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error:
                type: string
              code:
                type: string
                enum: [signup_not_open]
          example: { error: sign-up is not open yet, code: signup_not_open }
    NotFound:
      description: |
        Not found, or not owned by the caller — `404` rather than `403` so
        existence does not leak across tenants.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: not found }
    BlobTooLarge:
      description: |
        Body exceeds the Plan's per-blob cap, which the one plan sets to
        100 MiB — the value the server previously enforced as a constant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example: { error: blob too large }
    SubscriptionRequired:
      description: |
        The account may not write: it has no subscription, or its
        subscription lapsed and any Grace Period after a failed payment has
        ended. Only the hosted deployment (`AUTH_MODE=oidc`) can answer this;
        a self-hosted server sells nothing and gates nothing.

        Reads are never gated. Pulls, blob downloads, batch fetch, the SSE
        stream, capability, auth, the Login Hand-off, claiming the vault, and
        this billing route all keep working, so a lapsed card never strands a
        device or hides data someone already stored. Deleting the vault is
        gated, like every other write: someone who wants their data gone
        after lapsing asks for it to be deleted.

        Deliberately not `403`: nothing about the caller's identity is wrong,
        and the fix is a payment rather than a permission. `GET /api/billing`
        says which state produced the refusal.
      content:
        application/json:
          schema:
            type: object
            required: [error, code]
            properties:
              error:
                type: string
              code:
                type: string
                enum: [subscription_required]
          example:
            error: an active subscription is required to write
            code: subscription_required
    QuotaExceeded:
      description: |
        Storing these bytes would put the account past its Storage Quota.
        Only the hosted deployment (`AUTH_MODE=oidc`) can answer this; a
        self-hosted server has no plan ceiling.

        Answered at two points. An upload is refused when the bytes plainly
        will not fit, which avoids writing ciphertext that is going to be
        rejected. The **claim** is the enforcing check: staged bytes do not
        count until an object claims them, so an upload check on its own could
        be walked past by staging several blobs first and claiming them
        afterwards. On the two-call write path the refusal therefore arrives
        at `createObject` or `updateObject`, not at `uploadBlob`.

        A refused claim commits nothing and does **not** spend its
        `Mutation-Id`: the refusal is transient, so retrying the same mutation
        once the account has room succeeds rather than replaying the refusal.

        The body names the quota and the usage behind the refusal, so a client
        can say how much room is left rather than only that the write failed.
        Distinct from `413`: a smaller blob may fit, but the account is full,
        and deleting notes is what frees room — after the retention window,
        which is when the server's cleanup reclaims the bytes.
      content:
        application/json:
          schema:
            type: object
            required: [error, code, quota_bytes, bytes_used]
            properties:
              error:
                type: string
              code:
                type: string
                enum: [quota_exceeded]
              quota_bytes:
                type: integer
                format: int64
              bytes_used:
                type: integer
                format: int64
          example:
            error: storage quota exceeded
            code: quota_exceeded
            quota_bytes: 10000000000
            bytes_used: 9999999123

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Capability:
      type: object
      required: [name, version, auth_mode, signup, billing, mutation_ids]
      properties:
        name:
          type: string
          enum: [futo-notes]
        version:
          type: string
          description: Server build version.
          example: 0.6.0
        auth_mode:
          type: string
          enum: [dev, password, oidc]
          description: |
            Which login endpoint to drive.
        signup:
          type: string
          enum: [closed, open]
          description: |
            `open` in `oidc` mode, since any FUTO account can log in.
        billing:
          type: boolean
          description: |
            `true` on the hosted service, which is `AUTH_MODE=oidc` plus Polar
            configuration. The app shows the sign-up path when it sees both
            `auth_mode: oidc` and `billing: true`. A self-hosted server
            reports `false` and mounts none of the billing routes.
        mutation_ids:
          type: object
          required: [supported, required, retention_days, successful_create_outcomes]
          properties:
            supported:
              type: boolean
            required:
              type: boolean
              description: |
                False for backward compatibility with clients that predate
                Mutation-Ids.
            retention_days:
              type: integer
              description: Retention for non-create outcomes.
            successful_create_outcomes:
              type: string
              enum: [durable]
              description: |
                `durable` means successful creates are retained for the
                collection's lifetime, which is what makes a `404` from the
                recovery route trustworthy.

    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string

    Collection:
      type: object
      required: [id, user_id, current_version, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        current_version:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Collection-global pull cursor, bumped by 1 on every object
            mutation. A JSON **string** (Postgres `bigint`). A new collection
            starts at `"0"`.
          example: "42"
        created_at:
          type: string
          format: date-time

    CollectionEnvelope:
      type: object
      required: [collection]
      properties:
        collection:
          $ref: "#/components/schemas/Collection"

    KeyMaterial:
      type: object
      required:
        [key_salt, key_kdf, encrypted_vault_key, key_updated_at,
         recovery_key_salt, recovery_key_kdf, recovery_encrypted_vault_key]
      description: |
        Client-side vault key material. Every field is opaque to the server,
        which never sees the vault password, the recovery key, either derived
        key, or the vault key itself.

        `key_salt`, `key_kdf` and `encrypted_vault_key` are the **password
        envelope**: the vault key wrapped under the vault password. The three
        `recovery_*` fields are the **recovery envelope**: the same vault key
        wrapped under the recovery key instead. The recovery envelope is
        optional and the three fields are `null` together — that vault has no
        recovery key, so the vault password (or an already-unlocked device) is
        the only way in. They are always present in the response, `null` and
        all, so absence is explicit rather than a missing field.
      properties:
        key_salt:
          type: string
        key_kdf:
          type: object
          additionalProperties: true
        encrypted_vault_key:
          type: string
        key_updated_at:
          type: string
          format: date-time
          description: |
            Doubles as the opaque revision token for a guarded re-wrap. Treat
            as opaque: do not parse or synthesize it.
        recovery_key_salt:
          type: string
          nullable: true
        recovery_key_kdf:
          type: object
          nullable: true
          additionalProperties: true
        recovery_encrypted_vault_key:
          type: string
          nullable: true

    Object:
      type: object
      required:
        [id, collection_id, version, change_seq, deleted, blob_key, size_bytes, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        collection_id:
          type: string
          format: uuid
        version:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Per-object conflict counter, JSON **string**. A new object is `"1"`.
          example: "3"
        change_seq:
          type: string
          pattern: "^[0-9]+$"
          description: |
            The collection's `current_version` at the moment this object was
            last mutated. JSON **string**. Pull ordering key.
          example: "42"
        deleted:
          type: boolean
        blob_key:
          type: string
          nullable: true
        size_bytes:
          type: string
          pattern: "^[0-9]+$"
          nullable: true
          description: |
            Byte length the server measured when the blob was staged, JSON
            **string**. The column is nullable — treat `null` as unknown size —
            though every current write path populates it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeletedObject:
      type: object
      required: [id, version, change_seq, deleted]
      description: |
        Compact projection returned by soft delete, kept for wire
        compatibility.
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
          pattern: "^[0-9]+$"
        change_seq:
          type: string
          pattern: "^[0-9]+$"
        deleted:
          type: boolean
          enum: [true]

    CollectionVersion:
      type: integer
      format: int64
      description: |
        The collection's new cursor value after this mutation. Server-computed,
        so a JSON **number** — unlike `object.change_seq`, which is a string.

        Advance a local cursor to this value only if it equals `cursor + 1`;
        that is the only value proving no other device's change landed in
        between. A gap means leave the cursor alone and pull.

    ObjectList:
      type: object
      required: [objects]
      properties:
        objects:
          type: array
          items:
            $ref: "#/components/schemas/Object"

    PagedObjectList:
      type: object
      required: [objects, hasMore, nextCursor]
      description: Returned when `?limit` is supplied.
      properties:
        objects:
          type: array
          items:
            $ref: "#/components/schemas/Object"
        hasMore:
          type: boolean
        nextCursor:
          type: integer
          format: int64
          description: |
            The `change_seq` of the last returned object as a **number**, or
            the request's `sinceVersion` if the page was empty. Pass it as the
            next request's `sinceVersion` until `hasMore` is false.

    MutationSuccess:
      type: object
      required: [object, collectionVersion]
      properties:
        object:
          $ref: "#/components/schemas/Object"
        collectionVersion:
          $ref: "#/components/schemas/CollectionVersion"

    CreateMutationSuccess:
      type: object
      required: [object, collectionVersion, replayed]
      properties:
        object:
          $ref: "#/components/schemas/Object"
        collectionVersion:
          $ref: "#/components/schemas/CollectionVersion"
        replayed:
          type: boolean
          description: |
            `false` when this request committed the Mutation-Id, `true` when
            the server returned that Mutation-Id's retained outcome. Retry
            ciphertext never replaces the original blob.

    VersionConflict:
      type: object
      required: [error, currentVersion, currentBlobKey]
      description: |
        The stale-write rejection. The server surfaces conflicts and never
        merges — it sees only opaque blobs. Fetch `currentBlobKey`, three-way
        merge against the common ancestor, and retry at `currentVersion + 1`
        under a **new** Mutation-Id. If the merge fails, save a conflict copy.
      properties:
        error:
          type: string
          enum: [version conflict]
        currentVersion:
          type: integer
          format: int64
          description: Server-computed, so a JSON **number**.
        currentBlobKey:
          type: string
          nullable: true

    BlobNotStagedError:
      type: object
      required: [error]
      description: |
        The named `blob_key` is not in the `staged` ledger state — already
        claimed by an earlier mutation, or past its 24-hour staging window.
        Re-upload the ciphertext for a fresh key and retry under a new
        Mutation-Id.
      properties:
        error:
          type: string
          enum: [blob is not staged]

    MutationMismatchError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [Mutation-Id reused for different intent]

    BatchUploadResult:
      oneOf:
        - type: object
          required: [status, object, collectionVersion]
          properties:
            status:
              type: string
              enum: [created, replayed, updated]
              description: |
                `created` — the create Mutation-Id committed.
                `replayed` — it already had a retained outcome; retry
                ciphertext was ignored.
                `updated` — the versioned update committed.
            object:
              $ref: "#/components/schemas/Object"
            collectionVersion:
              $ref: "#/components/schemas/CollectionVersion"
        - type: object
          required: [status, currentVersion, currentBlobKey]
          description: Stale update.
          properties:
            status:
              type: string
              enum: [conflict]
            currentVersion:
              type: integer
              format: int64
            currentBlobKey:
              type: string
              nullable: true
        - type: object
          required: [status]
          description: The update target is absent or not owned by the caller.
          properties:
            status:
              type: string
              enum: [not_found]
        - type: object
          required: [status]
          description: This entry's blob exceeds the Plan's per-blob cap.
          properties:
            status:
              type: string
              enum: [too_large]
        - type: object
          required: [status, quota_bytes, bytes_used]
          description: |
            This entry would put the account past its Storage Quota, so it was
            skipped and later entries were still attempted. Entries are weighed
            in order against what the earlier ones claimed, so a batch cannot
            walk past the quota one entry at a time. Only the hosted deployment
            (`AUTH_MODE=oidc`) produces this status.
          properties:
            status:
              type: string
              enum: [quota_exceeded]
            quota_bytes:
              type: integer
              format: int64
            bytes_used:
              type: integer
              format: int64
        - type: object
          required: [status, error]
          description: |
            This entry failed operationally; later entries were still
            attempted. Also covers a batch create whose Mutation-Id was reused
            for a different intent (`mutation id reused for different intent`),
            which is an entry-level error here rather than a request-level 409.
          properties:
            status:
              type: string
              enum: [error]
            error:
              type: string
