default:
  tags:
    - dind
  image: node:24-slim
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@10 --activate

variables:
  PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build

# ─────────────────────────────────────────────────────────────
# Cache
# ─────────────────────────────────────────────────────────────

.cache-pnpm:
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push

# ─────────────────────────────────────────────────────────────
# Test
# ─────────────────────────────────────────────────────────────

test:
  stage: test
  cache:
    - !reference [.cache-pnpm, cache]
  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_USER: futo_notes
        POSTGRES_PASSWORD: ci
        POSTGRES_DB: futo_notes
  variables:
    DATABASE_URL: postgres://futo_notes:ci@postgres:5432/futo_notes
    AUTH_MODE: dev
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec tsc --noEmit
    - pnpm test

test:build:
  stage: test
  cache:
    - !reference [.cache-pnpm, cache]
  script:
    - pnpm install --frozen-lockfile
    # OSS code must never import from src/hosted/ (hosted code wraps OSS, not vice versa).
    - '! grep -rnE "from [''\"][^''\"]*hosted/" src --include=*.ts | grep -v "^src/hosted/"'
    - pnpm run build
    - pnpm run build:hosted
    - ls -la dist/index.js dist/hosted.js
    - echo "OSS bundle:"    && wc -c dist/index.js
    - echo "Hosted bundle:" && wc -c dist/hosted.js

test:docker:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    - |
      docker build -t futo-notes-server:ci .
      echo "Docker image built successfully"
      docker image inspect futo-notes-server:ci --format '{{.Size}}' | awk '{printf "Image size: %.1f MB\n", $1/1048576}'
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────
# Build + push Docker image
# ─────────────────────────────────────────────────────────────

build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  needs:
    - job: test
    - job: test:build
    - job: test:docker
  script:
    - |
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |
      # Tag semantics:
      #   tagged release -> push ${CI_COMMIT_TAG} + :stable
      #   main branch    -> push ${CI_COMMIT_SHORT_SHA} + :latest
      IMAGE="${CI_REGISTRY_IMAGE}/server"
      docker build -t "${IMAGE}:build" .
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "${IMAGE}:build" "${IMAGE}:${CI_COMMIT_TAG}"
        docker tag "${IMAGE}:build" "${IMAGE}:stable"
        docker push "${IMAGE}:${CI_COMMIT_TAG}"
        docker push "${IMAGE}:stable"
        echo "Pushed ${IMAGE}:${CI_COMMIT_TAG} and ${IMAGE}:stable"
      else
        docker tag "${IMAGE}:build" "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
        docker tag "${IMAGE}:build" "${IMAGE}:latest"
        docker push "${IMAGE}:${CI_COMMIT_SHORT_SHA}"
        docker push "${IMAGE}:latest"
        echo "Pushed ${IMAGE}:${CI_COMMIT_SHORT_SHA} and ${IMAGE}:latest"
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
