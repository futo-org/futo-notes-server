default:
  interruptible: true
  tags:
    - dind

stages:
  - test
  - adoption
  - build
  - publish

variables:
  GOTOOLCHAIN: auto

.skip-soak-schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'
      when: never
    - when: on_success

test:go:
  extends: .skip-soak-schedule
  stage: test
  image: golang:1.27-bookworm
  script:
    - go test ./...
    - go vet ./...

test:image:
  extends: .skip-soak-schedule
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build --build-arg VERSION="$CI_COMMIT_SHORT_SHA" -t futo-notes-server:ci .
    - docker image inspect futo-notes-server:ci --format '{{.Architecture}} {{.Size}}'

# This is the cutover gate, not a unit approximation. It creates databases with
# the current and historical TypeScript servers, drives them with the native
# Rust sync client, swaps Go in, audits cleanup, and rolls back to TypeScript.
test:adoption:
  extends: .skip-soak-schedule
  stage: adoption
  image: golang:1.27-bookworm
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: futo_notes
    POSTGRES_PASSWORD: ci
    POSTGRES_DB: futo_notes
    FUTO_POSTGRES_CONTAINER: direct
    FUTO_POSTGRES_HOST: postgres
    FUTO_POSTGRES_PORT: "5432"
    FUTO_POSTGRES_PASSWORD: ci
    FUTO_TS_SERVER_REPO: $CI_PROJECT_DIR/.rehearsal/ts-server
    FUTO_NOTES_CLIENT_REPO: $CI_PROJECT_DIR/.rehearsal/client
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    RUSTUP_HOME: $CI_PROJECT_DIR/.rustup
    BUN_INSTALL: $CI_PROJECT_DIR/.bun
  cache:
    key: adoption-toolchains
    paths:
      - .cargo/
      - .rustup/
      - .bun/install/cache/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential curl git jq postgresql-client ripgrep unzip
    - curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$BUN_INSTALL/bin:$CARGO_HOME/bin:$PATH"
    - mkdir -p .rehearsal
    - git clone "$CI_REPOSITORY_URL" "$FUTO_TS_SERVER_REPO"
    - git -C "$FUTO_TS_SERVER_REPO" checkout 5449502
    - git clone https://gitlab.futo.org/futo-notes/futo-notes.git "$FUTO_NOTES_CLIENT_REPO"
    - bun install --cwd "$FUTO_TS_SERVER_REPO" --frozen-lockfile
  script:
    - export PATH="$BUN_INSTALL/bin:$CARGO_HOME/bin:$PATH"
    - go run ./cmd/compare -mode all -ts-repo "$FUTO_TS_SERVER_REPO" -postgres "postgres://futo_notes:$FUTO_POSTGRES_PASSWORD@$FUTO_POSTGRES_HOST:$FUTO_POSTGRES_PORT/futo_notes"
    - ./scripts/rust-acceptance.sh ts
    - ./scripts/rust-acceptance.sh go
    - ./scripts/adoption-rehearsal.sh all

build:binaries:
  extends: .skip-soak-schedule
  stage: build
  image: golang:1.27-bookworm
  script:
    - VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - ./scripts/build-release.sh "$VERSION"
  artifacts:
    paths:
      - dist/
    expire_in: never

soak:staging:
  stage: test
  image: alpine:3.22
  before_script:
    - apk add --no-cache bash coreutils curl jq ripgrep
  script:
    - FUTO_SOAK_REMOTE=false ./scripts/staging-soak-check.sh "$FUTO_SOAK_EXPECTED_VERSION" "$FUTO_SOAK_STARTED_AT"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'

publish:candidate-image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
    GITLAB_IMAGE: $CI_REGISTRY_IMAGE/server
  needs:
    - test:go
    - test:image
    - test:adoption
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
    - docker buildx create --use --name futo-notes-candidate --driver docker-container
  script:
    - CANDIDATE_TAG="candidate-$CI_COMMIT_SHORT_SHA"
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --build-arg VERSION="$CANDIDATE_TAG" --tag "$GITLAB_IMAGE:$CANDIDATE_TAG" --tag "$GITLAB_IMAGE:candidate" --push .
    - docker buildx imagetools inspect "$GITLAB_IMAGE:$CANDIDATE_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == "go-rewrite"

publish:image:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
    DOCKERHUB_IMAGE: docker.io/futotech/notes-server
    GITLAB_IMAGE: $CI_REGISTRY_IMAGE/server
  needs:
    - test:go
    - test:image
    - test:adoption
  before_script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
    - docker buildx create --use --name futo-notes --driver docker-container
  script:
    - VERSION_TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - TRACK_TAG=$(if [ -n "$CI_COMMIT_TAG" ]; then echo stable; else echo latest; fi)
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --build-arg VERSION="$VERSION_TAG" --tag "$DOCKERHUB_IMAGE:$VERSION_TAG" --tag "$DOCKERHUB_IMAGE:$TRACK_TAG" --tag "$GITLAB_IMAGE:$VERSION_TAG" --tag "$GITLAB_IMAGE:$TRACK_TAG" --push .
    - docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$VERSION_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:binaries:
  stage: publish
  image: curlimages/curl:8.12.1
  needs:
    - job: build:binaries
      artifacts: true
    - job: test:adoption
  script:
    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/futo-notes-server/$CI_COMMIT_TAG"
    - for file in dist/*; do curl --fail --header "JOB-TOKEN:$CI_JOB_TOKEN" --upload-file "$file" "$PACKAGE_URL/$(basename "$file")"; done
  rules:
    - if: $CI_COMMIT_TAG
