default:
  tags:
    - dind
  image: oven/bun:1.3.14-slim
  interruptible: true

variables:
  BUN_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.bun-cache

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build

# ─────────────────────────────────────────────────────────────
# Cache
# ─────────────────────────────────────────────────────────────

.cache-bun:
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .bun-cache/
    policy: pull-push

# ─────────────────────────────────────────────────────────────
# Test
# ─────────────────────────────────────────────────────────────

test:
  stage: test
  cache:
    - !reference [.cache-bun, cache]
  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_USER: futo_notes
        POSTGRES_PASSWORD: ci
        POSTGRES_DB: futo_notes
  variables:
    DATABASE_URL: postgres://futo_notes:ci@postgres:5432/futo_notes
  script:
    - bun install --frozen-lockfile
    - bunx tsc --noEmit
    - bun run test

test:build:
  stage: test
  cache:
    - !reference [.cache-bun, cache]
  script:
    - bun install --frozen-lockfile
    # OSS code must never import from src/hosted/ (hosted code wraps OSS, not vice versa).
    - '! grep -rnE "from [''\"][^''\"]*hosted/" src --include=*.ts | grep -v "^src/hosted/"'
    # Every migration file must be registered in migration-registry.ts — the bundle
    # loads migrations from the static registry, not the filesystem.
    - bun scripts/check-migration-registry.mjs
    - bun run check:production-config
    - bun run check:installer
    - bun run build
    - bun run build:hosted
    - ls -la dist/index.js dist/hosted.js
    - echo "OSS bundle:"    && wc -c dist/index.js
    - echo "Hosted bundle:" && wc -c dist/hosted.js

test:docker:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    - |
      docker build -t futo-notes-server:ci .
      echo "Docker image built successfully"
      docker image inspect futo-notes-server:ci --format '{{.Size}}' | awk '{printf "Image size: %.1f MB\n", $1/1048576}'
      sh scripts/check-production-compose.sh
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────
# Build + push Docker image
# ─────────────────────────────────────────────────────────────

build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    # Docker Hub is the primary registry. The GitLab registry keeps receiving the
    # same manifest so self-hosters who pinned the old FUTO_NOTES_IMAGE still get
    # updates; drop the GitLab tags once the docs-default path has had a release
    # or two to propagate.
    DOCKERHUB_IMAGE: docker.io/futotech/notes-server
    BUILD_PLATFORMS: linux/amd64,linux/arm64
  before_script: []
  needs:
    - job: test
    - job: test:build
    - job: test:docker
  script:
    - |
      if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
        echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set as CI/CD variables." >&2
        echo "If they are marked Protected, this ref has to be protected too." >&2
        exit 1
      fi
      printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      printf '%s' "$DOCKERHUB_TOKEN"      | docker login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
    - |
      # This runner is amd64, so the arm64 leg is cross-built under QEMU. buildx
      # also needs the container driver: the default docker driver cannot emit a
      # multi-platform manifest list.
      docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
      docker buildx create --use --name futo-notes --driver docker-container
    - |
      # Tag semantics:
      #   tagged release -> ${CI_COMMIT_TAG} + :stable
      #   main branch    -> ${CI_COMMIT_SHORT_SHA} + :latest
      GITLAB_IMAGE="${CI_REGISTRY_IMAGE}/server"
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION_TAG="$CI_COMMIT_TAG"
        TRACK_TAG="stable"
      else
        VERSION_TAG="$CI_COMMIT_SHORT_SHA"
        TRACK_TAG="latest"
      fi
      # One build, four tags, two registries: buildx pushes the same manifest
      # list to each, so digests match everywhere. It also pushes nothing until
      # both architectures build, so a broken arm64 leg cannot publish a
      # half-populated tag.
      #
      # --provenance=false keeps the manifest list to the two real platforms;
      # buildx would otherwise attach an attestation that shows up as a bogus
      # "unknown/unknown" entry in registry UIs and confuses older clients.
      docker buildx build \
        --platform "$BUILD_PLATFORMS" \
        --provenance=false \
        --tag "${DOCKERHUB_IMAGE}:${VERSION_TAG}" \
        --tag "${DOCKERHUB_IMAGE}:${TRACK_TAG}" \
        --tag "${GITLAB_IMAGE}:${VERSION_TAG}" \
        --tag "${GITLAB_IMAGE}:${TRACK_TAG}" \
        --push .
      echo "Pushed ${VERSION_TAG} and ${TRACK_TAG} to ${DOCKERHUB_IMAGE} and ${GITLAB_IMAGE}"
      docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
