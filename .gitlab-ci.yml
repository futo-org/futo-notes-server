default:
  tags:
    - dind
  image: node:24-slim
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@10 --activate

variables:
  PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build
  - release

# ─────────────────────────────────────────────────────────────
# Cache
# ─────────────────────────────────────────────────────────────

.cache-pnpm:
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push

# ─────────────────────────────────────────────────────────────
# Test
# ─────────────────────────────────────────────────────────────

test:
  stage: test
  cache:
    - !reference [.cache-pnpm, cache]
  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_USER: stonefruit
        POSTGRES_PASSWORD: ci
        POSTGRES_DB: stonefruit
  variables:
    DATABASE_URL: postgres://stonefruit:ci@postgres:5432/stonefruit
    AUTH_MODE: dev
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec tsc --noEmit
    - pnpm test

test:build:
  stage: test
  cache:
    - !reference [.cache-pnpm, cache]
  script:
    - pnpm install --frozen-lockfile
    # OSS code must never import from src/hosted/ (hosted code wraps OSS, not vice versa).
    - '! grep -rnE "from [''\"][^''\"]*hosted/" src --include=*.ts | grep -v "^src/hosted/"'
    - pnpm run build
    - pnpm run build:hosted
    - ls -la dist/index.js dist/hosted.js
    - echo "OSS bundle:"    && wc -c dist/index.js
    - echo "Hosted bundle:" && wc -c dist/hosted.js

test:docker:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    - |
      docker build -t stonefruit-server:ci .
      echo "Docker image built successfully"
      docker image inspect stonefruit-server:ci --format '{{.Size}}' | awk '{printf "Image size: %.1f MB\n", $1/1048576}'
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────
# Build + push Docker image
# ─────────────────────────────────────────────────────────────

build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  needs:
    - job: test
    - job: test:build
    - job: test:docker
  script:
    - |
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |
      IMAGE="${CI_REGISTRY_IMAGE}/server"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="${CI_COMMIT_TAG}"
      else
        TAG="${CI_COMMIT_SHORT_SHA}"
      fi
      docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
      docker push "${IMAGE}:${TAG}"
      docker push "${IMAGE}:latest"
      echo "Pushed ${IMAGE}:${TAG} and ${IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────
# Installer (Go binary) — test + release
# ─────────────────────────────────────────────────────────────

test:installer:
  stage: test
  image: golang:1.25
  before_script: []
  script:
    - cd installer
    - go vet ./...
    - go test ./...
    - go build ./...

release:installer:
  stage: release
  image: golang:1.25
  before_script: []
  script:
    # Cross-compile all 4 targets.
    - mkdir -p dist
    - |
      set -e
      cd installer
      for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
        os="${target%-*}"; arch="${target#*-}"
        GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
          go build -trimpath -ldflags="-s -w -X gitlab.futo.org/stonefruit/stonefruit-server/installer/cmd.Version=${CI_COMMIT_TAG}" \
          -o "../dist/stonefruit-${target}" ./
      done
      cd ..
      ls -lh dist/
    # Upload each binary to the generic package registry.
    - |
      set -e
      for bin in dist/stonefruit-*; do
        name=$(basename "$bin")
        URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stonefruit-installer/${CI_COMMIT_TAG}/${name}"
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$bin" "$URL"
        echo "Uploaded $name"
      done
    # Install release-cli.
    - |
      curl -sL "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/latest/release-cli-linux-amd64" \
        -o /usr/local/bin/release-cli && chmod +x /usr/local/bin/release-cli
    # Create the release with one asset link per binary.
    - |
      set -e
      ARGS=""
      for bin in dist/stonefruit-*; do
        name=$(basename "$bin")
        URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stonefruit-installer/${CI_COMMIT_TAG}/${name}"
        ARGS="$ARGS --assets-link={\"name\":\"${name}\",\"url\":\"${URL}\",\"link_type\":\"package\"}"
      done
      # shellcheck disable=SC2086
      release-cli create \
        --name "Stonefruit Server ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "Stonefruit self-hosted sync server ${CI_COMMIT_TAG}. Install via: curl -sSL https://gitlab.futo.org/stonefruit/stonefruit-server/-/raw/main/install.sh | sh" \
        $ARGS
  needs:
    - job: build:image
  rules:
    - if: $CI_COMMIT_TAG
