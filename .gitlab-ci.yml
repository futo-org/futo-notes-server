default:
  tags:
    - dind
  image: node:24-slim
  interruptible: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@10 --activate

variables:
  PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - test
  - build
  - release

# ─────────────────────────────────────────────────────────────
# Cache
# ─────────────────────────────────────────────────────────────

.cache-pnpm:
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push

# ─────────────────────────────────────────────────────────────
# Test
# ─────────────────────────────────────────────────────────────

test:
  stage: test
  cache:
    - !reference [.cache-pnpm, cache]
  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_USER: stonefruit
        POSTGRES_PASSWORD: ci
        POSTGRES_DB: stonefruit
  variables:
    DATABASE_URL: postgres://stonefruit:ci@postgres:5432/stonefruit
    AUTH_MODE: dev
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec tsc --noEmit
    - pnpm test

test:build:
  stage: test
  cache:
    - !reference [.cache-pnpm, cache]
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
    - ls -la dist/index.js
    - echo "Bundle size:" && wc -c dist/index.js

test:docker:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    - |
      docker build -t stonefruit-server:ci .
      echo "Docker image built successfully"
      docker image inspect stonefruit-server:ci --format '{{.Size}}' | awk '{printf "Image size: %.1f MB\n", $1/1048576}'
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────
# Build + push Docker image
# ─────────────────────────────────────────────────────────────

build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  needs:
    - job: test
    - job: test:build
    - job: test:docker
  script:
    - |
      docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - |
      IMAGE="${CI_REGISTRY_IMAGE}/server"
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG="${CI_COMMIT_TAG}"
      else
        TAG="${CI_COMMIT_SHORT_SHA}"
      fi
      docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
      docker push "${IMAGE}:${TAG}"
      docker push "${IMAGE}:latest"
      echo "Pushed ${IMAGE}:${TAG} and ${IMAGE}:latest"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────────────────────────────────────────────────────────
# CLI release (tags only)
# Builds the CLI bundle, uploads to the generic package registry,
# then creates a GitLab release that install.sh can resolve.
# ─────────────────────────────────────────────────────────────

release:cli:
  stage: release
  cache:
    - !reference [.cache-pnpm, cache]
  script:
    # Install curl + ca-certs (node:24-slim doesn't include them)
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    # Build CLI bundle
    - pnpm install --frozen-lockfile
    - pnpm --filter @futo-notes/cli run build
    - ls -la packages/cli/dist/cli.js
    # Upload to generic package registry
    - |
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stonefruit-cli/${CI_COMMIT_TAG}/stonefruit-cli.mjs"
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file packages/cli/dist/cli.js "$PACKAGE_URL"
      echo "Uploaded CLI bundle to $PACKAGE_URL"
    # Install release-cli and create GitLab release linking to the package
    - |
      curl -sL "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/latest/release-cli-linux-amd64" \
        -o /usr/local/bin/release-cli && chmod +x /usr/local/bin/release-cli
    - |
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/stonefruit-cli/${CI_COMMIT_TAG}/stonefruit-cli.mjs"
      release-cli create \
        --name "Stonefruit Server ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "Stonefruit self-hosted sync server ${CI_COMMIT_TAG}. Install via: curl -sSL https://gitlab.futo.org/stonefruit/stonefruit-server/-/raw/main/install.sh | sh" \
        --assets-link "{\"name\":\"stonefruit-cli.mjs\",\"url\":\"${PACKAGE_URL}\",\"link_type\":\"other\"}"
  needs:
    - job: build:image
  rules:
    - if: $CI_COMMIT_TAG
