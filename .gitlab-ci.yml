default:
  interruptible: true
  tags:
    - dind

stages:
  - test
  - adoption
  - build
  - publish

variables:
  GOTOOLCHAIN: auto

.skip-soak-schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'
      when: never
    - when: on_success

test:go:
  extends: .skip-soak-schedule
  stage: test
  image: golang:1.27-bookworm@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea
  services:
    - name: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
      alias: postgres
    # Same image as compose.hosted.yml.
    - name: cgr.dev/chainguard/minio@sha256:1ec745a06a986762f89e68e855fc189f403941eff8c0a5f94767e92c8e39d3f5
      alias: minio
      command: ["server", "/tmp/data"]
      variables:
        MINIO_ROOT_USER: minio
        MINIO_ROOT_PASSWORD: miniominio
        _MINIO_DRIVE_ACTIVE_MONITORING: "off"
  variables:
    POSTGRES_USER: futo_notes
    POSTGRES_PASSWORD: ci
    POSTGRES_DB: futo_notes
    OBJECTS_TEST_DATABASE_URL: postgres://futo_notes:ci@postgres:5432/objects_test
    EVENTS_TEST_DATABASE_URL: postgres://futo_notes:ci@postgres:5432/events_test
    JOBS_TEST_DATABASE_URL: postgres://futo_notes:ci@postgres:5432/jobs_test
    BLOBS_TEST_DATABASE_URL: postgres://futo_notes:ci@postgres:5432/blobs_test
    SERVER_TEST_DATABASE_URL: postgres://futo_notes:ci@postgres:5432/server_test
    MIGRATION_TEST_DATABASE_URL: postgres://futo_notes:ci@postgres:5432/migration_test
    HOSTED_TEST_DATABASE_URL: postgres://futo_notes:ci@postgres:5432/hosted_test
    HOSTED_E2E_DATABASE_URL: postgres://futo_notes:ci@postgres:5432/hosted_e2e
    S3_TEST_ENDPOINT: http://minio:9000
    S3_TEST_ACCESS_KEY_ID: minio
    S3_TEST_SECRET_ACCESS_KEY: miniominio
    S3_TEST_REGION: us-east-1
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - |
      for db in objects_test events_test jobs_test blobs_test server_test migration_test hosted_test hosted_e2e; do
        PGPASSWORD=ci createdb -h postgres -U futo_notes "$db"
      done
    # One bucket per storage region, created with a SigV4-signed PUT, so the
    # job needs no MinIO client.
    - |
      for _ in $(seq 1 60); do
        curl -sf "$S3_TEST_ENDPOINT/minio/health/ready" && break
        sleep 1
      done
      for bucket in notes-us-east notes-eu-central notes-ap-southeast; do
        curl -sSf -X PUT --aws-sigv4 "aws:amz:$S3_TEST_REGION:s3" \
          --user "$S3_TEST_ACCESS_KEY_ID:$S3_TEST_SECRET_ACCESS_KEY" "$S3_TEST_ENDPOINT/$bucket"
      done
  script:
    - go test -race ./...
    - go vet ./...
    - go run ./cmd/compare -engine-parity -mode dev -postgres "postgres://futo_notes:$POSTGRES_PASSWORD@postgres:5432/futo_notes"

lint:go:
  extends: .skip-soak-schedule
  stage: test
  image: golangci/golangci-lint:v2.15.0@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481
  script:
    - golangci-lint run ./...

.mise:
  image:
    name: jdxcode/mise:2026.11.8-debian@sha256:05360b08fb68ace24d4814adaa6f36371584f6931782ead4891872049667af5a
    entrypoint: [""]
  variables:
    MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR
    MISE_YES: "1"

k8s:validate:
  extends:
    - .skip-soak-schedule
    - .mise
  stage: test
  script:
    - mise install helm kubeconform
    - mise run k8s:validate

test:image:
  extends: .skip-soak-schedule
  stage: test
  image: docker:29@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  services:
    - docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build --build-arg VERSION="$CI_COMMIT_SHORT_SHA" -t futo-notes-server:ci .
    - docker image inspect futo-notes-server:ci --format '{{.Architecture}} {{.Size}}'
    # publish:image needs this job, so no image with a fixable HIGH or CRITICAL
    # vulnerability ships: Debian packages and the Go modules in the binary.
    # Unfixed ones are skipped; the Dockerfile's apt-get upgrade picks up a Debian
    # fix on the next build, so re-running the pipeline is the remedy. The socket
    # mount resolves on the dind daemon, which is where the image was built.
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 futo-notes-server:ci

test:storage-image:
  extends: .skip-soak-schedule
  stage: test
  image: docker:29@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  services:
    - docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build -f cmd/storage/Dockerfile --build-arg VERSION="$CI_COMMIT_SHORT_SHA" -t futo-notes-storage:ci .
    - docker image inspect futo-notes-storage:ci --format '{{.Architecture}} {{.Size}}'

test:api-image:
  extends: .skip-soak-schedule
  stage: test
  image: docker:29@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  services:
    - docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  variables:
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build -f cmd/api/Dockerfile --build-arg VERSION="$CI_COMMIT_SHORT_SHA" -t futo-notes-api:ci .
    - docker image inspect futo-notes-api:ci --format '{{.Architecture}} {{.Size}}'

# This is the cutover gate, not a unit approximation. It creates databases with
# the current and historical TypeScript servers, drives them with the native
# Rust sync client, swaps Go in, audits cleanup, and rolls back to TypeScript.
test:adoption:
  extends: .skip-soak-schedule
  stage: adoption
  image: golang:1.27-bookworm@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea
  services:
    - name: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
      alias: postgres
  variables:
    POSTGRES_USER: futo_notes
    POSTGRES_PASSWORD: ci
    POSTGRES_DB: futo_notes
    FUTO_POSTGRES_CONTAINER: direct
    FUTO_POSTGRES_HOST: postgres
    FUTO_POSTGRES_PORT: "5432"
    FUTO_POSTGRES_PASSWORD: ci
    FUTO_TS_SERVER_REPO: $CI_PROJECT_DIR/.rehearsal/ts-server
    FUTO_NOTES_CLIENT_REPO: $CI_PROJECT_DIR/.rehearsal/client
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    RUSTUP_HOME: $CI_PROJECT_DIR/.rustup
    BUN_INSTALL: $CI_PROJECT_DIR/.bun
  cache:
    key: adoption-toolchains
    paths:
      - .cargo/
      - .rustup/
      - .bun/install/cache/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential curl git jq postgresql-client ripgrep unzip
    - curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$BUN_INSTALL/bin:$CARGO_HOME/bin:$PATH"
    - mkdir -p .rehearsal
    - git clone "$CI_REPOSITORY_URL" "$FUTO_TS_SERVER_REPO"
    - git -C "$FUTO_TS_SERVER_REPO" checkout 5449502
    - git clone https://gitlab.futo.org/futo-notes/futo-notes.git "$FUTO_NOTES_CLIENT_REPO"
    - bun install --cwd "$FUTO_TS_SERVER_REPO" --frozen-lockfile
  script:
    - export PATH="$BUN_INSTALL/bin:$CARGO_HOME/bin:$PATH"
    - go run ./cmd/compare -mode all -ts-repo "$FUTO_TS_SERVER_REPO" -postgres "postgres://futo_notes:$FUTO_POSTGRES_PASSWORD@$FUTO_POSTGRES_HOST:$FUTO_POSTGRES_PORT/futo_notes"
    - ./scripts/rust-acceptance.sh ts
    - ./scripts/rust-acceptance.sh go
    - ./scripts/rust-acceptance.sh go sqlite
    - ./scripts/sqlite-migration-rehearsal.sh
    - ./scripts/adoption-rehearsal.sh all

build:binaries:
  extends: .skip-soak-schedule
  stage: build
  image: golang:1.27-bookworm@sha256:4fa7c968ba93f1635670522dbb01a2c78150443e1385746924566079f36570ea
  script:
    - VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - ./scripts/build-release.sh "$VERSION"
  artifacts:
    paths:
      - dist/
    expire_in: never

# Starts the hosted test stack from this pipeline's release artifacts and
# drives a client through it, as the apps' CI does.
test:hosted-stack:
  extends: .skip-soak-schedule
  stage: build
  # The image jobs' image, service and TLS setting, so it runs on every runner
  # they do. Go comes from apk, and GOTOOLCHAIN=auto fetches the version go.mod
  # asks for.
  image: docker:29@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  services:
    - docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  needs:
    - job: build:binaries
      artifacts: true
  variables:
    DOCKER_TLS_CERTDIR: /certs
    GOTOOLCHAIN: auto
  before_script:
    - apk add --no-cache bash curl go
    # Where dind runs, DOCKER_HOST is tcp://docker:... and the launcher reaches
    # the containers there. One runner instead mounts the host's Docker socket
    # into every container, which kills the dind service, and the image's
    # entrypoint falls back to that socket. The stack then shares the host
    # daemon: it takes a Compose project and ports of this job's own and
    # publishes them on the job's bridge gateway, where the job reaches them.
    - |
      case "${DOCKER_HOST:-unix://}" in
      unix://*)
        export HOSTED_STACK_CONTAINER_HOST=$(ip route | awk '/^default/ {print $3}')
        export COMPOSE_PROJECT_NAME=hosted-stack-$CI_JOB_ID
        export HOSTED_STACK_POSTGRES_PORT=$((20000 + CI_JOB_ID % 5000))
        export HOSTED_STACK_MINIO_PORT=$((25000 + CI_JOB_ID % 5000))
        ;;
      esac
    - echo "DOCKER_HOST=${DOCKER_HOST:-unset} HOSTED_STACK_CONTAINER_HOST=${HOSTED_STACK_CONTAINER_HOST:-unset}"
    - docker info --format '{{.ServerVersion}}'
  script:
    - ./scripts/hosted-stack-smoke.sh dist "${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"

soak:staging:
  stage: test
  image: alpine:3.24@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
  before_script:
    - apk add --no-cache bash coreutils curl jq ripgrep
  script:
    - FUTO_SOAK_REMOTE=false ./scripts/staging-soak-check.sh "$FUTO_SOAK_EXPECTED_VERSION" "$FUTO_SOAK_STARTED_AT"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'

# Scan exactly what the publish job pushes, one platform at a time: test:image
# scans a native build only, and publishing rebuilds amd64 and arm64. These
# --load builds run on the same buildx builder with the same VERSION, so the
# push that follows reuses their cached layers and publishes what was scanned.
.scan-published-platforms:
  script:
    - |
      for platform in amd64 arm64; do
        docker buildx build --platform "linux/$platform" --provenance=false --build-arg VERSION="$SCAN_VERSION" --load --tag "futo-notes-server:scan-$platform" . || exit 1
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "futo-notes-server:scan-$platform" || exit 1
      done

publish:candidate-image:
  stage: publish
  image: docker:29@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  services:
    - docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  variables:
    DOCKER_TLS_CERTDIR: /certs
    DOCKERHUB_IMAGE: docker.io/futotech/notes-server
    GITLAB_IMAGE: $CI_REGISTRY_IMAGE/server
  needs:
    - test:go
    - test:image
    - test:adoption
  before_script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
    - docker buildx create --use --name futo-notes-candidate --driver docker-container
  script:
    - CANDIDATE_TAG="candidate-$CI_COMMIT_SHORT_SHA"
    - SCAN_VERSION="$CANDIDATE_TAG"
    - !reference [.scan-published-platforms, script]
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --build-arg VERSION="$CANDIDATE_TAG" --tag "$DOCKERHUB_IMAGE:$CANDIDATE_TAG" --tag "$DOCKERHUB_IMAGE:go-candidate" --tag "$GITLAB_IMAGE:$CANDIDATE_TAG" --tag "$GITLAB_IMAGE:candidate" --push .
    - docker buildx imagetools inspect "$DOCKERHUB_IMAGE:go-candidate"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == "go-rewrite"

publish:image:
  stage: publish
  image: docker:29@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  services:
    - docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  variables:
    DOCKER_TLS_CERTDIR: /certs
    DOCKERHUB_IMAGE: docker.io/futotech/notes-server
    GITLAB_IMAGE: $CI_REGISTRY_IMAGE/server
  needs:
    - test:go
    - test:image
    - test:adoption
  before_script:
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin docker.io
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
    - docker buildx create --use --name futo-notes --driver docker-container
  script:
    - VERSION_TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - TRACK_TAG=$(if [ -n "$CI_COMMIT_TAG" ]; then echo stable; else echo latest; fi)
    - SCAN_VERSION="$VERSION_TAG"
    - !reference [.scan-published-platforms, script]
    - docker buildx build --platform linux/amd64,linux/arm64 --provenance=false --build-arg VERSION="$VERSION_TAG" --tag "$DOCKERHUB_IMAGE:$VERSION_TAG" --tag "$DOCKERHUB_IMAGE:$TRACK_TAG" --tag "$GITLAB_IMAGE:$VERSION_TAG" --tag "$GITLAB_IMAGE:$TRACK_TAG" --push .
    - docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$VERSION_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Hosted images and charts go to oci.futo.org, logged in with the masked
# OCI_REGISTRY_USER / OCI_REGISTRY_PASSWORD variables; Docker Hub and the
# GitLab registry carry the self-hosted server.
publish:storage-image:
  stage: publish
  image: docker:29@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  services:
    - docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  variables:
    DOCKER_TLS_CERTDIR: /certs
    HOSTED_IMAGE: oci.futo.org/futo-notes/notes-storage
  needs:
    - test:go
    - lint:go
    - test:storage-image
  before_script:
    - printf '%s' "$OCI_REGISTRY_PASSWORD" | docker login --username "$OCI_REGISTRY_USER" --password-stdin oci.futo.org
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
    - docker buildx create --use --name futo-notes-storage --driver docker-container
  script:
    - VERSION_TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - TRACK_TAG=$(if [ -n "$CI_COMMIT_TAG" ]; then echo stable; else echo latest; fi)
    - docker buildx build -f cmd/storage/Dockerfile --platform linux/amd64,linux/arm64 --provenance=false --build-arg VERSION="$VERSION_TAG" --tag "$HOSTED_IMAGE:$VERSION_TAG" --tag "$HOSTED_IMAGE:$TRACK_TAG" --push .
    - docker buildx imagetools inspect "$HOSTED_IMAGE:$VERSION_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:api-image:
  stage: publish
  image: docker:29@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  services:
    - docker:29-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c
  variables:
    DOCKER_TLS_CERTDIR: /certs
    HOSTED_IMAGE: oci.futo.org/futo-notes/notes-api
  needs:
    - test:go
    - lint:go
    - test:api-image
  before_script:
    - printf '%s' "$OCI_REGISTRY_PASSWORD" | docker login --username "$OCI_REGISTRY_USER" --password-stdin oci.futo.org
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3 --install arm64
    - docker buildx create --use --name futo-notes-api --driver docker-container
  script:
    - VERSION_TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - TRACK_TAG=$(if [ -n "$CI_COMMIT_TAG" ]; then echo stable; else echo latest; fi)
    - docker buildx build -f cmd/api/Dockerfile --platform linux/amd64,linux/arm64 --provenance=false --build-arg VERSION="$VERSION_TAG" --tag "$HOSTED_IMAGE:$VERSION_TAG" --tag "$HOSTED_IMAGE:$TRACK_TAG" --push .
    - docker buildx imagetools inspect "$HOSTED_IMAGE:$VERSION_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Chart versions are 0.0.<pipeline iid>; appVersion is the short SHA, the tag
# the image publish jobs push on the default branch. Charts go out only once
# every image they point at exists, so each app chart's image job is in
# `needs`.
publish:charts:
  extends: .mise
  stage: publish
  needs:
    - k8s:validate
    - publish:storage-image
    - publish:api-image
  script:
    - mise install helm
    - mise run charts:package "0.0.$CI_PIPELINE_IID" "$CI_COMMIT_SHORT_SHA" dist/charts
    - printf '%s' "$OCI_REGISTRY_PASSWORD" | mise exec -- helm registry login oci.futo.org --username "$OCI_REGISTRY_USER" --password-stdin
    - for chart in dist/charts/*.tgz; do mise exec -- helm push "$chart" oci://oci.futo.org/futo-notes/charts; done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $FUTO_SOAK_CHECK == "true"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish:binaries:
  stage: publish
  image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
  needs:
    - job: build:binaries
      artifacts: true
    - job: test:adoption
    - job: test:hosted-stack
  script:
    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/futo-notes-server/$CI_COMMIT_TAG"
    - for file in dist/futo-notes-server_*; do curl --fail --header "JOB-TOKEN:$CI_JOB_TOKEN" --upload-file "$file" "$PACKAGE_URL/$(basename "$file")"; done
    # The hosted binaries and the test-stack bundle are a package of their
    # own, so the self-hosted one keeps exactly its files.
    - HOSTED_PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/futo-notes-hosted/$CI_COMMIT_TAG"
    - for file in dist/hosted/*; do curl --fail --header "JOB-TOKEN:$CI_JOB_TOKEN" --upload-file "$file" "$HOSTED_PACKAGE_URL/$(basename "$file")"; done
  rules:
    - if: $CI_COMMIT_TAG
