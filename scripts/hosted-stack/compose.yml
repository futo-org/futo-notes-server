# Postgres and MinIO for hosted-stack.sh, which sets every variable below.
# Test use only. Nothing is persisted: `down` leaves no data behind.
name: futo-notes-hosted-stack

services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notes
    ports:
      - ${HOSTED_STACK_BIND:?}:${HOSTED_STACK_POSTGRES_PORT:?}:5432
    tmpfs:
      - /var/lib/postgresql
    # Over TCP: the image's first-boot init server listens on the socket only,
    # so a socket check passes before the real server is up.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres -d notes']
      interval: 1s
      timeout: 5s
      retries: 60

  minio:
    image: cgr.dev/chainguard/minio@sha256:1ec745a06a986762f89e68e855fc189f403941eff8c0a5f94767e92c8e39d3f5
    command: server /tmp/data
    ports:
      - ${HOSTED_STACK_BIND:?}:${HOSTED_STACK_MINIO_PORT:?}:9000
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniominio
      _MINIO_DRIVE_ACTIVE_MONITORING: off
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 1s
      timeout: 5s
      retries: 60

  # One bucket per storage region, named notes-<region>.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:1260ca38acf78bf8d2833845fda6636b27388ab919b750d79f2c7167fb45ec74
    environment:
      MC_HOST_local: http://minio:miniominio@minio:9000
    command: mb --ignore-existing local/notes-us-east local/notes-eu-central local/notes-ap-southeast
    depends_on:
      minio:
        condition: service_healthy
