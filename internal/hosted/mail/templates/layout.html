<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:24px 16px;background:#f6f7f9;color:#1c1f26;font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
<div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #d9dce3;border-radius:8px;padding:24px;">
<p style="margin:0 0 16px;font-weight:600;">FUTO Notes</p>
{{template "body" .}}
<p style="margin:24px 0 0;">
<a href="{{.DashboardURL}}" style="display:inline-block;background:#2f5fd0;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;">{{block "action" .}}Open your account{{end}}</a>
</p>
</div>
<p style="max-width:560px;margin:16px auto 0;color:#5b6272;font-size:13px;">You are receiving this because it concerns your FUTO Notes account, {{.Email}}.</p>
</body>
</html>
