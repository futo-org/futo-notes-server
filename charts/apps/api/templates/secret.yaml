{{- /* The dev key fixtures only enter the Secret when explicitly
opted in (useDevKeys, local dev only); see values.yaml. */}}
{{- if .Values.useDevKeys }}
{{- $devKeys := dict "API_SIGNING_KEY" .Values.devApiSigningKey "STORAGE_REFRESH_ROTATION_KEY" .Values.devStorageRefreshRotationKey }}
{{- $_ := set .Values "secretData" (merge $devKeys (.Values.secretData | default dict)) }}
{{- end }}
{{- include "notes-common.secret" . }}
