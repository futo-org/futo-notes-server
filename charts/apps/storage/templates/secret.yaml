{{- include "storage.region" . }}
{{- /* The dev key fixtures only enter the Secret when explicitly opted in
(useDevKeys, local dev only); see values.yaml. */}}
{{- if .Values.useDevKeys }}
{{- $receiptKey := required (printf "no dev receipt key for region %q" .Values.region) (get .Values.devReceiptSigningKeys .Values.region) }}
{{- $_ := set .Values "secretData" (merge (dict "API_PUBLIC_KEYS" .Values.devApiPublicKeys "RECEIPT_SIGNING_KEY" $receiptKey) (.Values.secretData | default dict)) }}
{{- end }}
{{- include "notes-common.secret" . }}
