# CNPG Cluster. The name is the stable in-cluster identifier; the API chart
# derives its POSTGRES_* env from the "<clusterName>-app" secret that CNPG
# generates, so keep this consistent across dev and prod.
clusterName: notes-db
instances: 1
storage: 1Gi
storageClass: ""
database: notes
owner: notes
# Pinned operand image: the operator's compiled-in default changes (and can
# jump Postgres majors) on operator upgrades, so never leave this implicit.
# Same major as compose.hosted.yml.
imageName: ghcr.io/cloudnative-pg/postgresql:18.6
# Per-instance postgres pod resources (CNPG spec.resources). Empty = BestEffort
# (dev default); real clusters set this via the HelmRelease.
resources: {}
# CNPG spec.affinity. Real clusters set podAntiAffinityType: required — the
# default "preferred" can co-schedule two instances, and local PVs
# (WaitForFirstConsumer) then pin that co-location permanently.
affinity: {}
# CNPG spec.postgresql.synchronous. Empty = async, the CNPG default.
synchronous: {}
# Barman Cloud plugin backups (WAL archiving + daily base backup) to an
# S3-compatible object store. Requires the plugin-barman-cloud release in
# cnpg-system, so dev keeps this off.
backup:
  enabled: false
  bucket: ""
  endpointURL: ""
  # Secret holding ACCESS_KEY_ID / ACCESS_SECRET_KEY / CA_CERT. barman cannot
  # skip TLS verification, so the endpoint's CA must always be supplied.
  secretName: ""
  retentionPolicy: 30d
  schedule: "0 0 2 * * *"
