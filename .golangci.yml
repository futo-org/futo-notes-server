version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - intrange
    - modernize
    - nilnil
    - perfsprint
    - revive
    - usestdlibvars
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
