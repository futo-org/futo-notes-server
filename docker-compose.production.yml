services:
  server:
    image: ${FUTO_NOTES_IMAGE:-futotech/notes-server:stable}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://futo_notes:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/futo_notes
      PORT: "3000"
      AUTH_MODE: password
      FUTO_NOTES_PASSWORD: ${FUTO_NOTES_PASSWORD:-}
      FUTO_NOTES_PASSWORD_HASH: ${FUTO_NOTES_PASSWORD_HASH:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BLOB_DIR: /data/blobs
      BLOB_GC_ENABLED: ${BLOB_GC_ENABLED:-true}
    ports:
      - "${FUTO_NOTES_PORT:-3005}:3000"
    volumes:
      - ${FUTO_NOTES_DATA_DIR:-./futo-notes-data}/blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: futo_notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: futo_notes
    volumes:
      - ${FUTO_NOTES_DATA_DIR:-./futo-notes-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futo_notes -d futo_notes"]
      interval: 5s
      timeout: 3s
      retries: 15
