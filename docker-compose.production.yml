services:
  server:
    container_name: futo-notes
    build: .
    ports:
      - "${FUTO_NOTES_PORT:-3005}:3000"
    environment:
      DATABASE_URL: postgres://futo_notes:${POSTGRES_PASSWORD:-changeme}@postgres:5432/futo_notes
      PORT: "3000"
      BLOB_DIR: /data/blobs
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_MODE: password
      FUTO_NOTES_PASSWORD_HASH: ${FUTO_NOTES_PASSWORD_HASH}
    volumes:
      - blob-data:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: futo-notes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: futo_notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: futo_notes
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futo_notes -d futo_notes"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  pg-data:
  blob-data:
