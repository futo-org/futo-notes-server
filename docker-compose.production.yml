services:
  server:
    container_name: stonefruit
    build: .
    ports:
      - "${STONEFRUIT_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://stonefruit:${POSTGRES_PASSWORD:-changeme}@postgres:5432/stonefruit
      PORT: "3000"
      BLOB_DIR: /data/blobs
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_MODE: password
    volumes:
      - blob-data:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: stonefruit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stonefruit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: stonefruit
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stonefruit -d stonefruit"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  pg-data:
  blob-data:
